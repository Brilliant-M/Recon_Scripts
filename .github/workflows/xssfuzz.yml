name: XSS & Open Redirect Fuzz

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Root domain (e.g. example.com)'
        required: true
        type: string
      mode:
        description: 'Scan mode'
        required: true
        type: choice
        default: 'active'
        options:
          - passive    # subfinder + historical URLs only, no crawling
          - active     # subfinder + httpx + katana crawl + historical URLs
      threads:
        description: 'Concurrency for httpx/katana (default 10)'
        required: false
        type: string
        default: '10'
      rate:
        description: 'Max requests/sec for httpx/katana (default 20)'
        required: false
        type: string
        default: '20'
      dalfox_delay:
        description: 'Dalfox delay between requests in ms (default 200)'
        required: false
        type: string
        default: '200'

concurrency:
  group: xssfuzz-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  xss:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'  # FIXED: Updated to latest stable Go
          cache: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable' # Let setup-go install the latest stable Go
          cache: false

      - name: Install Go tools
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          # GOTOOLCHAIN: local has been removed
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/tomnomnom/gf@latest
          go install github.com/tomnomnom/waybackurls@latest
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/tomnomnom/qsreplace@latest
          go install github.com/hahwul/dalfox/v2@latest
          go install github.com/tomnomnom/anew@latest
          go install github.com/owasp-amass/amass/v4/...@master || echo "amass optional, skipping"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          dalfox version
          subfinder -version
          httpx -version
          
      - name: Install Python tools (uro, dnsgen)
        run: |
          pip3 install --quiet uro dnsgen

      - name: Download gf patterns
        run: |
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns.git /tmp/gf-patterns
          mkdir -p "$HOME/.gf"
          cp /tmp/gf-patterns/*.json "$HOME/.gf/" || true
          if [ ! -f "$HOME/.gf/xss.json" ]; then
            git clone --depth 1 https://github.com/tomnomnom/gf.git /tmp/gf
            cp /tmp/gf/examples/*.json "$HOME/.gf/" || true
          fi
          ls "$HOME/.gf/" | head -20
          test -f "$HOME/.gf/xss.json" || { echo "❌ xss.json pattern missing"; exit 1; }
          echo "✅ gf patterns ready"

      - name: Download XSS wordlist
        run: |
          mkdir -p wordlists
          primary="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Fuzzing/XSS/robot-friendly/XSS-Jhaddix.txt"
          fallback="https://raw.githubusercontent.com/payloadbox/xss-payload-list/master/Intruder/xss-payload-list.txt"
          if curl -fsSL "$primary" -o wordlists/xss.txt 2>/dev/null; then
            echo "[+] Downloaded primary XSS wordlist (robot-friendly)"
          elif curl -fsSL "$fallback" -o wordlists/xss.txt 2>/dev/null; then
            echo "[!] Primary failed (404/moved) — using fallback wordlist"
          else
            echo "❌ Both XSS wordlist sources failed"
            exit 1
          fi
          lines=$(wc -l < wordlists/xss.txt | tr -d ' ')
          echo "[+] XSS wordlist: $lines entries"
          test -s wordlists/xss.txt
          head -3 wordlists/xss.txt

      # ---------- PHASE 1 ----------
      - name: Enumerate subdomains
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          mkdir -p work
          echo "[*] Passive subdomain enumeration for $TARGET"
          subfinder -d "$TARGET" -all -silent -o work/subs.txt || true
          if [ ! -s work/subs.txt ]; then
            echo "[!] subfinder empty, falling back to crt.sh"
            curl -s "https://crt.sh/?q=%25.$TARGET&output=json" \
              | jq -r '.[].name_value' \
              | sed 's/\*\.//g' | tr ',' '\n' \
              | grep -oE "[A-Za-z0-9._-]+\.${TARGET}" \
              | sort -u > work/subs.txt || true
          fi
          sort -u work/subs.txt -o work/subs.txt
          n=$(wc -l < work/subs.txt | tr -d ' ')
          echo "[+] Subdomains: $n"
          test "$n" -gt 0 || { echo "❌ No subdomains found"; exit 1; }

      # ---------- PHASE 2 (with WORKING_SUBS output) ----------
      - name: Probe live hosts
        env:
          THREADS: ${{ inputs.threads }}
          RATE: ${{ inputs.rate }}
        run: |
          set -euo pipefail
          echo "[*] Probing live hosts with httpx"
          httpx -l work/subs.txt \
            -ports 80,443,8080,8443 \
            -sc -title -tech-detect -cdn -silent \
            -t "$THREADS" -rl "$RATE" -timeout 10 \
            -o work/live_hosts.txt || true
          n=$(wc -l < work/live_hosts.txt 2>/dev/null | tr -d ' ')
          echo "[+] Live hosts: $n"
          test "$n" -gt 0 || { echo "❌ No live hosts"; exit 1; }

          awk '{print $1}' work/live_hosts.txt | sort -u > work/WORKING_SUBS.txt
          echo "[+] WORKING_SUBS.txt: $(wc -l < work/WORKING_SUBS.txt | tr -d ' ') URLs"
          echo "--- preview ---"
          head -5 work/WORKING_SUBS.txt

      # ---------- PHASE 3 ----------
      - name: Collect URLs (katana + gau + waybackurls)
        env:
          TARGET: ${{ inputs.target }}
          THREADS: ${{ inputs.threads }}
          RATE: ${{ inputs.rate }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p work
          echo "[*] Historical URLs (gau + waybackurls)"
          gau --subs "$TARGET" --threads "$THREADS" 2>/dev/null > work/historical.txt || true
          waybackurls "$TARGET" 2>/dev/null >> work/historical.txt || true
          sort -u work/historical.txt -o work/historical.txt || true
          echo "[+] Historical URLs: $(wc -l < work/historical.txt | tr -d ' ')"

          if [ "$MODE" = "active" ]; then
            echo "[*] Active crawl with katana"
            katana -list work/live_hosts.txt \
              -d 3 -jc -kf all -fx \
              -c "$THREADS" -p "$THREADS" \
              -rl "$RATE" \
              -silent -o work/crawled.txt 2>/dev/null || true
            echo "[+] Crawled URLs: $(wc -l < work/crawled.txt 2>/dev/null | tr -d ' ')"
          else
            : > work/crawled.txt
          fi

          cat work/historical.txt work/crawled.txt 2>/dev/null \
            | sed '/^$/d' | uro | sort -u > work/all_urls.txt || true
          echo "[+] Merged unique URLs: $(wc -l < work/all_urls.txt | tr -d ' ')"

      # ---------- PHASE 4 ----------
      - name: Filter XSS and redirect candidates
        run: |
          set -euo pipefail
          mkdir -p work

          cat work/all_urls.txt | gf xss > work/xss_candidates.txt 2>/dev/null || true
          echo "[+] XSS candidate URLs: $(wc -l < work/xss_candidates.txt | tr -d ' ')"

          cat work/all_urls.txt | gf redirect > work/redirect_candidates.txt 2>/dev/null || true
          echo "[+] Redirect candidate URLs: $(wc -l < work/redirect_candidates.txt | tr -d ' ')"

          # Extract parameters using pure bash
          : > work/PARAMETERS_WITH_XSS_POTENTIAL.txt
          while IFS= read -r url; do
            [[ -z "$url" ]] && continue
            q="${url#*\?}"
            [[ "$q" == "$url" ]] && continue
            params=$(echo "$q" | tr '&' '\n' | cut -d'=' -f1 | grep -v '^$' | sort -u | paste -sd, -)
            if [[ -n "$params" ]]; then
              echo "$url | $params" >> work/PARAMETERS_WITH_XSS_POTENTIAL.txt
            fi
          done < work/xss_candidates.txt
          
          pcount=$(wc -l < work/PARAMETERS_WITH_XSS_POTENTIAL.txt | tr -d ' ')
          echo "[+] PARAMETERS_WITH_XSS_POTENTIAL.txt: $pcount URLs"

          awk -F'|' '{print $2}' work/PARAMETERS_WITH_XSS_POTENTIAL.txt \
            | tr ',' '\n' | sed 's/^ *//; s/ *$//' | sed '/^$/d' \
            | sort | uniq -c | sort -rn > work/PARAM_NAMES.txt
          echo "[+] PARAM_NAMES.txt (top 10):"
          head -10 work/PARAM_NAMES.txt || true

          echo "--- XSS candidates (first 5) ---"
          head -5 work/xss_candidates.txt || true
          echo "--- Redirect candidates (first 5) ---"
          head -5 work/redirect_candidates.txt || true

      # ---------- PHASE 5 ----------
      - name: Run Dalfox XSS scan
        if: ${{ hashFiles('work/xss_candidates.txt') != '' }}
        env:
          DALFOX_DELAY: ${{ inputs.dalfox_delay }}
        run: |
          set -euo pipefail
          echo "[*] Running Dalfox on $(wc -l < work/xss_candidates.txt | tr -d ' ') URLs"

          cat work/xss_candidates.txt | \
            dalfox pipe \
              --silence \
              --delay "$DALFOX_DELAY" \
              --follow-redirects \
              --format json \
              -o work/xss_results.json || true

          if [ -s work/xss_results.json ]; then
            jq -r '
              if type == "array" then .[] else . end
              | "\(.type) \(.method) \(.url) param=\(.param) payload=\(.payload)"
            ' work/xss_results.json > work/xss_findings.txt 2>/dev/null || true
          fi
          echo "[+] XSS findings: $(wc -l < work/xss_findings.txt 2>/dev/null | tr -d ' ')"

          if [ -s work/xss_results.json ]; then
            jq -r '
              (if type == "array" then .[] else . end)
              | select((.type // "") | test("XSS|VULN|verified"; "i"))
              | "\(.url) | \(.param // "-") | \(.payload // "-")"
            ' work/xss_results.json > work/CONFIRMED_XSS.txt 2>/dev/null || true
            echo "[+] CONFIRMED_XSS.txt: $(wc -l < work/CONFIRMED_XSS.txt 2>/dev/null | tr -d ' ') PoCs"
          fi

      # ---------- PHASE 6 ----------
      - name: Test open redirects
        if: ${{ hashFiles('work/redirect_candidates.txt') != '' }}
        env:
          RATE: ${{ inputs.rate }}
        run: |
          set -euo pipefail
          echo "[*] Testing $(wc -l < work/redirect_candidates.txt | tr -d ' ') redirect candidates"
          : > work/redirect_findings.txt

          while IFS= read -r url; do
            [[ -z "$url" ]] && continue
            testurl=$(printf '%s' "$url" | qsreplace 'https://evil.com' 2>/dev/null || echo "$url")
            final=$(curl -sk -o /dev/null -w '%{redirect_url}' --max-time 8 -L "$testurl" 2>/dev/null || true)
            if echo "$final" | grep -qi 'evil\.com'; then
              echo "[OPEN-REDIRECT] $url  ->  $final" | tee -a work/redirect_findings.txt
            fi
            sleep 0.1
          done < work/redirect_candidates.txt

          n=$(wc -l < work/redirect_findings.txt 2>/dev/null | tr -d ' ')
          echo "[+] Open redirect findings: $n"

      # ---------- PHASE 7 ----------
      - name: Merge and dedupe findings
        run: |
          set -euo pipefail
          : > work/ALL_FINDINGS.txt

          if [ -f work/CONFIRMED_XSS.txt ] && [ -s work/CONFIRMED_XSS.txt ]; then
            echo "=== CONFIRMED XSS ===" >> work/ALL_FINDINGS.txt
            cat work/CONFIRMED_XSS.txt >> work/ALL_FINDINGS.txt
            echo "" >> work/ALL_FINDINGS.txt
          elif [ -f work/xss_findings.txt ] && [ -s work/xss_findings.txt ]; then
            echo "=== XSS ===" >> work/ALL_FINDINGS.txt
            cat work/xss_findings.txt >> work/ALL_FINDINGS.txt
            echo "" >> work/ALL_FINDINGS.txt
          fi

          if [ -f work/redirect_findings.txt ] && [ -s work/redirect_findings.txt ]; then
            echo "=== OPEN REDIRECTS ===" >> work/ALL_FINDINGS.txt
            cat work/redirect_findings.txt >> work/ALL_FINDINGS.txt
          fi

          echo "--- preview ---"
          head -30 work/ALL_FINDINGS.txt || true

          echo ""
          echo "=== KEY OUTPUT FILES ==="
          for f in WORKING_SUBS.txt PARAMETERS_WITH_XSS_POTENTIAL.txt PARAM_NAMES.txt CONFIRMED_XSS.txt; do
            if [ -f "work/$f" ]; then
              echo "  ✅ $f : $(wc -l < "work/$f" | tr -d ' ') lines"
            else
              echo "  ⚠️  $f : not produced"
            fi
          done

      # ---------- outputs ----------
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xssfuzz-${{ inputs.target }}-${{ github.run_id }}
          path: |
            work/
            wordlists/
          retention-days: 30
          if-no-files-found: warn

      # ---------- Telegram ----------
      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET:             ${{ inputs.target }}
          MODE:               ${{ inputs.mode }}
          JOB_STATUS:         ${{ job.status }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "[!] Telegram secrets not configured — skipping"
            exit 0
          fi

          MSG="$RUNNER_TEMP/tg.txt"

          subs=0; live=0; work_subs=0; param_urls=0; xss=0; redir=0
          [ -f work/subs.txt ]                           && subs=$(wc -l < work/subs.txt | tr -d ' ')
          [ -f work/live_hosts.txt ]                     && live=$(wc -l < work/live_hosts.txt | tr -d ' ')
          [ -f work/WORKING_SUBS.txt ]                   && work_subs=$(wc -l < work/WORKING_SUBS.txt | tr -d ' ')
          [ -f work/PARAMETERS_WITH_XSS_POTENTIAL.txt ]  && param_urls=$(wc -l < work/PARAMETERS_WITH_XSS_POTENTIAL.txt | tr -d ' ')
          [ -f work/CONFIRMED_XSS.txt ]                  && xss=$(wc -l < work/CONFIRMED_XSS.txt | tr -d ' ')
          [ -f work/redirect_findings.txt ]              && redir=$(wc -l < work/redirect_findings.txt | tr -d ' ')

          {
            echo "🎯 XSS FUZZ — ${JOB_STATUS}"
            echo "Target: ${TARGET}"
            echo "Mode:   ${MODE}"
            echo ""
            echo "📊 Results"
            echo "• Subdomains found:       ${subs}"
            echo "• Working subs:           ${work_subs}"
            echo "• Param URLs (potential): ${param_urls}"
            echo "• Confirmed XSS:          ${xss}"
            echo "• Open redirects:         ${redir}"
            echo ""

            if [ "$xss" -gt 0 ] && [ -f work/CONFIRMED_XSS.txt ]; then
              echo "💥 Confirmed XSS:"
              head -8 work/CONFIRMED_XSS.txt | sed 's/^/  /'
              [ "$xss" -gt 8 ] && echo "  ... +$((xss - 8)) more"
              echo ""
            fi

            if [ "$redir" -gt 0 ] && [ -f work/redirect_findings.txt ]; then
              echo "🔀 Open redirects:"
              head -5 work/redirect_findings.txt | sed 's/^/  /'
              [ "$redir" -gt 5 ] && echo "  ... +$((redir - 5)) more"
              echo ""
            fi

            echo "📁 Files in artifact:"
            echo "  • WORKING_SUBS.txt"
            echo "  • PARAMETERS_WITH_XSS_POTENTIAL.txt"
            echo "  • PARAM_NAMES.txt"
            echo "  • CONFIRMED_XSS.txt"
            echo "  • ALL_FINDINGS.txt"
            echo ""
            echo "🔗 ${RUN_URL}"
          } > "$MSG"

          if [ "$(wc -c < "$MSG")" -gt 4000 ]; then
            head -c 3900 "$MSG" > "${MSG}.t"
            printf '\n\n... [truncated — see artifact]\n' >> "${MSG}.t"
            mv "${MSG}.t" "$MSG"
          fi

          curl -sS -o /dev/null -w '[+] Telegram: HTTP %{http_code}\n' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@${MSG}" \
            -d "disable_web_page_preview=true" \
            --max-time 30 || echo "[!] Telegram send failed (continuing)"

      # ---------- GitHub summary ----------
      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## XSS & Open Redirect Fuzz — \`${{ inputs.target }}\`"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Mode | \`${{ inputs.mode }}\` |"
            echo "| Threads | \`${{ inputs.threads }}\` |"
            echo "| Rate | \`${{ inputs.rate }}\` req/s |"
            echo "| Dalfox delay | \`${{ inputs.dalfox_delay }}\` ms |"
            echo ""

            echo "### 📁 Key output files (in artifact)"
            echo ""
            echo "| File | Contents | Lines |"
            echo "|---|---|---|"
            for spec in \
              "WORKING_SUBS.txt|Live HTTP hosts (clean URLs)" \
              "PARAMETERS_WITH_XSS_POTENTIAL.txt|URL + param names" \
              "PARAM_NAMES.txt|Unique param names, ranked" \
              "CONFIRMED_XSS.txt|Dalfox PoCs (URL | param | payload)" \
              "ALL_FINDINGS.txt|Merged XSS + open-redirect" \
              "redirect_findings.txt|Open redirect hits"
            do
              f="${spec%%|*}"
              desc="${spec##*|}"
              if [ -f "work/$f" ]; then
                n=$(wc -l < "work/$f" | tr -d ' ')
                echo "| \`$f\` | $desc | $n |"
              else
                echo "| \`$f\` | $desc | — |"
              fi
            done
            echo ""

            if [ -f work/WORKING_SUBS.txt ] && [ -s work/WORKING_SUBS.txt ]; then
              echo "### 🌐 Working subs (top 30 of $(wc -l < work/WORKING_SUBS.txt))"
              echo '```'
              head -30 work/WORKING_SUBS.txt
              echo '```'
              echo ""
            fi

            if [ -f work/PARAM_NAMES.txt ] && [ -s work/PARAM_NAMES.txt ]; then
              echo "### 🔍 Top parameter names"
              echo '```'
              head -20 work/PARAM_NAMES.txt
              echo '```'
              echo ""
            fi

            if [ -f work/CONFIRMED_XSS.txt ] && [ -s work/CONFIRMED_XSS.txt ]; then
              echo "### 💥 Confirmed XSS ($(wc -l < work/CONFIRMED_XSS.txt))"
              echo '```'
              head -50 work/CONFIRMED_XSS.txt
              echo '```'
              echo ""
            fi

            if [ -f work/redirect_findings.txt ] && [ -s work/redirect_findings.txt ]; then
              echo "### 🔀 Open Redirects ($(wc -l < work/redirect_findings.txt))"
              echo '```'
              head -30 work/redirect_findings.txt
              echo '```'
              echo ""
            fi

            if { [ ! -s work/CONFIRMED_XSS.txt ] && [ ! -s work/redirect_findings.txt ]; } 2>/dev/null; then
              echo "### ⚠️ No confirmed findings"
              echo ""
              echo "Possible reasons:"
              echo "- No XSS/open-redirect present (good for the target)"
              echo "- \`work/xss_candidates.txt\` was empty — no URLs had param shapes \`gf xss\` recognizes"
              echo "- Crawl was shallow — switch \`mode\` to \`active\` and re-run"
              echo ""
              echo "Debug files in artifact: \`all_urls.txt\`, \`xss_candidates.txt\`, \`xss_results.json\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
        continue-on-error: true
