name: Directory Fuzz

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Target(s) — comma, space, or newline separated'
        required: true
        type: string
      wordlist:
        description: 'Wordlist tier'
        required: true
        type: choice
        default: 'quick'
        options: [quick, standard, deep, custom]
      custom_wordlist:
        description: 'Custom wordlist URL (only when wordlist=custom)'
        required: false
        type: string
        default: ''
      recursion:
        description: 'Recursion (feroxbuster)'
        required: true
        type: choice
        default: 'off'
        options: ['off', 'on']
      depth:
        description: 'Max recursion depth (recursion=on only; 0=unlimited)'
        required: false
        type: string
        default: '2'
      threads:
        description: 'Threads (default 20)'
        required: false
        type: string
        default: '20'
      rate:
        description: 'Max req/sec (default 20)'
        required: false
        type: string
        default: '20'

concurrency:
  group: dirfuzz-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install base packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl unzip dnsutils

      - name: Install ffuf + uro
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/ffuf/ffuf/v2@latest
          pip3 install --quiet uro
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install feroxbuster
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL https://raw.githubusercontent.com/epi052/feroxbuster/main/install-nix.sh | bash -s "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download wordlist
        id: wl
        run: |
          mkdir -p wordlists
          case "${{ inputs.wordlist }}" in
            quick)    URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt" ;;
            standard) URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/directory-list-2.3-medium.txt" ;;
            deep)     URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/raft-large-directories.txt" ;;
            custom)
              [ -z "${{ inputs.custom_wordlist }}" ] && { echo "❌ custom_wordlist URL required"; exit 1; }
              URL="${{ inputs.custom_wordlist }}"
              ;;
          esac
          echo "Downloading: $URL"
          curl -fsSL "$URL" -o wordlists/target.txt
          echo "[+] $(wc -l < wordlists/target.txt) entries downloaded."

      - name: Parse targets
        id: parse
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          if [ -z "$TARGETS" ]; then exit 1; fi
          mkdir -p work
          echo "$TARGETS" | tr -s ' ,\t' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d' > work/subs.txt
          echo "count=$(wc -l < work/subs.txt)" >> "$GITHUB_OUTPUT"

      # ==========================================
      # THIS STEP BUILDS AND RUNS THE SCRIPT
      # ==========================================
      - name: Generate and Run fuzzall.sh
        env:
          THREADS:   ${{ inputs.threads }}
          RATE:      ${{ inputs.rate }}
          DEPTH:     ${{ inputs.depth }}
          RECURSION: ${{ inputs.recursion }}
        run: |
          # 1. Write the bash script to a file on the runner
          cat > fuzzall.sh << 'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -uo pipefail

          WORDLIST=""
          SUBS_FILE=""
          THREADS=20
          RATE=20
          OUTDIR="./fuzz_out"
          FEROX_RECURSION=1
          FEROX_DEPTH=""

          while [[ $# -gt 0 ]]; do
            case "$1" in
              -w) WORDLIST="$2"; shift 2 ;;
              -l) SUBS_FILE="$2"; shift 2 ;;
              -t) THREADS="$2"; shift 2 ;;
              -R|--rate) RATE="$2"; shift 2 ;;
              -o) OUTDIR="$2"; shift 2 ;;
              -d) FEROX_DEPTH="$2"; shift 2 ;;
              --no-recursion) FEROX_RECURSION=0; shift ;;
              *) shift ;;
            esac
          done

          mkdir -p "$OUTDIR"
          TMP="$OUTDIR/.tmp"
          mkdir -p "$TMP"

          clean_subs () {
            tr -d '\r' < "$1" | sed -E 's/#.*$//; s/^[[:space:]]+//; s/[[:space:]]+$//' | sed -E '/^$/d' | sed -E 's#^([^:/]+)$#https://\1#' | sort -u
          }

          dedupe () {
            if command -v uro >/dev/null 2>&1; then uro | sort -u; else sort -u; fi
          }

          CLEANED="$OUTDIR/subs.cleaned.txt"
          clean_subs "$SUBS_FILE" > "$CLEANED"

          while IFS= read -r entry; do
            [[ -z "$entry" ]] && continue
            url="$entry"
            safe=$(printf '%s' "$url" | sed -E 's#https?://##; s#[/:?&=]#_#g; s#_+$##')
            base="$OUTDIR/$safe"

            echo "[*] target: $url"

            ferox_args=(-u "$url" -w "$WORDLIST" -t "$THREADS" --rate-limit "$RATE" --scan-limit 2 --auto-tune --auto-bail --timeout 10 --json -o "${base}.ferox.jsonl" -q)
            [[ "$FEROX_RECURSION" -eq 0 ]] && ferox_args+=( --no-recursion )
            [[ -n "$FEROX_DEPTH" ]]        && ferox_args+=( --depth "$FEROX_DEPTH" )

            feroxbuster "${ferox_args[@]}" >/dev/null 2>&1 || true

            ffuf -w "$WORDLIST" -u "${url%/}/FUZZ" -t "$THREADS" -rate "$RATE" -timeout 10 -ac -of json -o "${base}.ffuf.json" -s >/dev/null 2>&1 || true

            jq -r '.url // empty' "${base}.ferox.jsonl" 2>/dev/null > "${TMP}/${safe}.ferox.urls" || true
            jq -r '.results[]?.url // empty' "${base}.ffuf.json" 2>/dev/null > "${TMP}/${safe}.ffuf.urls" || true

            cat "${TMP}/${safe}.ferox.urls" "${TMP}/${safe}.ffuf.urls" 2>/dev/null | sed '/^[[:space:]]*$/d' | dedupe > "${base}.urls.txt"
          done < "$CLEANED"

          MASTER="$OUTDIR/ALL_UNIQUE_URLS.txt"
          cat "$OUTDIR"/*.urls.txt 2>/dev/null | sed '/^[[:space:]]*$/d' | dedupe > "$MASTER"
          echo "[+] Master file: $MASTER"
          SCRIPT_EOF

          # 2. Make it executable
          chmod +x fuzzall.sh

          # 3. Run it!
          ARGS=(-w wordlists/target.txt -l work/subs.txt -t "$THREADS" -R "$RATE" -o fuzz_out)
          if [ "$RECURSION" = "off" ]; then
            ARGS+=(--no-recursion)
          elif [ -n "$DEPTH" ] && [ "$DEPTH" != "0" ]; then
            ARGS+=(-d "$DEPTH")
          fi
          
          echo "▶ ./fuzzall.sh ${ARGS[*]}"
          ./fuzzall.sh "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dirfuzz-${{ github.run_id }}
          path: fuzz_out/
          retention-days: 30
          if-no-files-found: warn

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_COUNT:       ${{ steps.parse.outputs.count }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then exit 0; fi
          total=0; [ -f fuzz_out/ALL_UNIQUE_URLS.txt ] && total=$(wc -l < fuzz_out/ALL_UNIQUE_URLS.txt)
          
          MSG="📂 DIR FUZZ — ${{ job.status }}%0A• Targets: ${TARGET_COUNT}%0A• Unique URLs: ${total}%0A🔗 ${RUN_URL}"
          curl -sS -o /dev/null -w '[+] Telegram: HTTP %{http_code}\n' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}" || true

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Directory Fuzz"
            echo "| Targets | ${{ steps.parse.outputs.count }} |"
            echo "| Wordlist | \`${{ inputs.wordlist }}\` |"
            echo "| Recursion | \`${{ inputs.recursion }}\` |"
            echo ""
            if [ -f fuzz_out/ALL_UNIQUE_URLS.txt ]; then
              n=$(wc -l < fuzz_out/ALL_UNIQUE_URLS.txt | tr -d ' ')
              echo "### ✅ Unique URLs: $n"
              echo '```'; head -100 fuzz_out/ALL_UNIQUE_URLS.txt; echo '```'
            else
              echo "### ⚠️ No results produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
        continue-on-error: true
