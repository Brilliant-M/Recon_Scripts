name: Directory Fuzz

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Target(s) — comma, space, or newline separated'
        required: true
        type: string
      wordlist:
        description: 'Wordlist tier'
        required: true
        type: choice
        default: 'quick'
        options: [quick, standard, deep, custom]
      custom_wordlist:
        description: 'Custom wordlist URL (http/https only; used when wordlist=custom)'
        required: false
        type: string
        default: ''
      recursion:
        description: 'Recursion (feroxbuster)'
        required: true
        type: choice
        default: 'off'
        options: ['off', 'on']
      depth:
        description: 'Max recursion depth (recursion=on only; 0 = unlimited)'
        required: false
        type: string
        default: '2'
      threads:
        description: 'Threads (default 20)'
        required: false
        type: string
        default: '20'
      rate:
        description: 'Max req/sec (default 20)'
        required: false
        type: string
        default: '20'
      exclude_codes:
        description: 'Comma-separated status codes to drop from merged results (e.g. 403,500)'
        required: false
        type: string
        default: ''
      per_target_timeout:
        description: 'Max minutes to spend per target, per tool (default 15)'
        required: false
        type: string
        default: '15'

concurrency:
  group: dirfuzz-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # All free-text inputs are validated BEFORE any tool runs, and everywhere
      # below they are passed via `env:` + `$VAR`, never spliced into run: text
      # directly — the old workflow interpolated some inputs straight into shell
      # (e.g. `URL="${{ inputs.custom_wordlist }}"`), which is a classic GitHub
      # Actions script-injection hole: a crafted input value could break out of
      # the quotes and run arbitrary commands on the runner.
      - name: Validate inputs
        env:
          WORDLIST_TIER: ${{ inputs.wordlist }}
          CUSTOM_WORDLIST: ${{ inputs.custom_wordlist }}
          DEPTH: ${{ inputs.depth }}
          THREADS: ${{ inputs.threads }}
          RATE: ${{ inputs.rate }}
          TIMEOUT_MIN: ${{ inputs.per_target_timeout }}
          EXCLUDE_CODES: ${{ inputs.exclude_codes }}
        run: |
          set -euo pipefail
          err() { echo "❌ $1"; exit 1; }

          [[ "$THREADS"     =~ ^[0-9]+$ ]] || err "threads must be a positive integer"
          [[ "$RATE"        =~ ^[0-9]+$ ]] || err "rate must be a positive integer"
          [[ "$DEPTH"       =~ ^[0-9]+$ ]] || err "depth must be a non-negative integer (0 = unlimited)"
          [[ "$TIMEOUT_MIN" =~ ^[0-9]+$ ]] || err "per_target_timeout must be a positive integer"

          if [ -n "$EXCLUDE_CODES" ]; then
            [[ "$EXCLUDE_CODES" =~ ^[0-9]+(,[0-9]+)*$ ]] || err "exclude_codes must be comma-separated numbers, e.g. 403,500"
          fi

          if [ "$WORDLIST_TIER" = "custom" ]; then
            [ -z "$CUSTOM_WORDLIST" ] && err "custom_wordlist URL required when wordlist=custom"
            [[ "$CUSTOM_WORDLIST" =~ ^https?:// ]] || err "custom_wordlist must be an http(s) URL"
          fi
          echo "✅ inputs OK"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install base packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl unzip

      - name: Install ffuf + uro
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Pinned instead of @latest — bump this deliberately when you want to upgrade.
          go install github.com/ffuf/ffuf/v2@v2.1.0
          pip3 install --quiet uro
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          ffuf -V
          uro --help >/dev/null && echo "uro OK"

      - name: Install feroxbuster
        run: |
          mkdir -p "$HOME/.local/bin"
          # Pinned to a tag instead of `main` — bump deliberately when you want to upgrade.
          FEROX_REF="v2.10.1"
          curl -sL "https://raw.githubusercontent.com/epi052/feroxbuster/${FEROX_REF}/install-nix.sh" | bash -s "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/feroxbuster" --version

      - name: Cache wordlist
        id: wl_cache
        uses: actions/cache@v4
        with:
          path: wordlists/target.txt
          key: wordlist-${{ inputs.wordlist }}-${{ inputs.custom_wordlist }}

      - name: Download wordlist
        if: steps.wl_cache.outputs.cache-hit != 'true'
        env:
          WORDLIST_TIER: ${{ inputs.wordlist }}
          CUSTOM_WORDLIST: ${{ inputs.custom_wordlist }}
        run: |
          mkdir -p wordlists
          case "$WORDLIST_TIER" in
            quick)    URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt" ;;
            standard) URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/directory-list-2.3-medium.txt" ;;
            deep)     URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/raft-large-directories.txt" ;;
            custom)   URL="$CUSTOM_WORDLIST" ;;
          esac
          echo "Downloading: $URL"
          curl -fsSL "$URL" -o wordlists/target.txt

      - name: Wordlist stats
        id: wl
        run: |
          lines=$(wc -l < wordlists/target.txt | tr -d ' ')
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "[+] $lines entries ready."

      - name: Parse targets
        id: parse
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          if [ -z "$TARGETS" ]; then
            echo "❌ Error: The 'targets' input cannot be empty."
            exit 1
          fi
          mkdir -p work
          echo "$TARGETS" | tr -s ' ,\t' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d' > work/subs.txt
          n=$(wc -l < work/subs.txt | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          cat work/subs.txt

      # ==========================================
      # THIS STEP BUILDS AND RUNS THE SCRIPT
      # ==========================================
      - name: Generate and Run fuzzall.sh
        env:
          THREADS:       ${{ inputs.threads }}
          RATE:          ${{ inputs.rate }}
          DEPTH:         ${{ inputs.depth }}
          RECURSION:     ${{ inputs.recursion }}
          EXCLUDE_CODES: ${{ inputs.exclude_codes }}
          TIMEOUT_MIN:   ${{ inputs.per_target_timeout }}
        run: |
          # 1. Write the bash script to a file on the runner
          cat > fuzzall.sh << 'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -uo pipefail

          WORDLIST=""
          SUBS_FILE=""
          THREADS=20
          RATE=20
          OUTDIR="./fuzz_out"
          FEROX_RECURSION=1
          FEROX_DEPTH=""
          TARGET_TIMEOUT=900
          EXCLUDE_CODES=""

          while [[ $# -gt 0 ]]; do
            case "$1" in
              -w) WORDLIST="$2"; shift 2 ;;
              -l) SUBS_FILE="$2"; shift 2 ;;
              -t) THREADS="$2"; shift 2 ;;
              -R|--rate) RATE="$2"; shift 2 ;;
              -o) OUTDIR="$2"; shift 2 ;;
              -d) FEROX_DEPTH="$2"; shift 2 ;;
              -T) TARGET_TIMEOUT="$2"; shift 2 ;;
              -x) EXCLUDE_CODES="$2"; shift 2 ;;
              --no-recursion) FEROX_RECURSION=0; shift ;;
              *) shift ;;
            esac
          done

          mkdir -p "$OUTDIR"
          TMP="$OUTDIR/.tmp"
          mkdir -p "$TMP"

          # Fix: the old version only added https:// when a line had NO ':' or
          # '/' anywhere, so "host:8080" or "host/path" were left schemeless and
          # broke every downstream tool. Now it only checks the actual prefix.
          clean_subs () {
            tr -d '\r' < "$1" \
              | sed -E 's/#.*$//; s/^[[:space:]]+//; s/[[:space:]]+$//' \
              | sed -E '/^$/d' \
              | while IFS= read -r line; do
                  case "$line" in
                    http://*|https://*) echo "$line" ;;
                    *) echo "https://$line" ;;
                  esac
                done \
              | sort -u
          }

          dedupe () {
            if command -v uro >/dev/null 2>&1; then uro | sort -u; else sort -u; fi
          }

          # Drops rows whose status code is in EXCLUDE_CODES, then keeps just the URL.
          filter_codes () {
            if [[ -n "$EXCLUDE_CODES" ]]; then
              awk -F'\t' -v exclude=",${EXCLUDE_CODES}," '{ if (index(exclude, "," $2 ",") == 0) print $1 }'
            else
              awk -F'\t' '{ print $1 }'
            fi
          }

          CLEANED="$OUTDIR/subs.cleaned.txt"
          clean_subs "$SUBS_FILE" > "$CLEANED"

          while IFS= read -r entry; do
            [[ -z "$entry" ]] && continue
            url="$entry"
            hash=$(printf '%s' "$url" | sha1sum | cut -c1-8)
            safe="$(printf '%s' "$url" | sed -E 's#https?://##; s#[^A-Za-z0-9]+#_#g; s#_+$##')_${hash}"
            base="$OUTDIR/$safe"

            echo "[*] target: $url (timeout ${TARGET_TIMEOUT}s per tool)"

            ferox_args=(-u "$url" -w "$WORDLIST" -t "$THREADS" --rate-limit "$RATE" --scan-limit 2 --auto-tune --auto-bail --timeout 10 --json -o "${base}.ferox.jsonl" -q)
            [[ "$FEROX_RECURSION" -eq 0 ]] && ferox_args+=( --no-recursion )
            # Always pass -d explicitly when recursion is on — feroxbuster treats
            # depth=0 as "unlimited", but the old script *omitted* -d for depth=0,
            # which silently fell back to feroxbuster's own default depth instead.
            [[ "$FEROX_RECURSION" -eq 1 ]] && ferox_args+=( --depth "$FEROX_DEPTH" )

            timeout "${TARGET_TIMEOUT}s" feroxbuster "${ferox_args[@]}" >/dev/null 2>&1 || true

            timeout "${TARGET_TIMEOUT}s" ffuf -w "$WORDLIST" -u "${url%/}/FUZZ" -t "$THREADS" -rate "$RATE" -timeout 10 -ac -of json -o "${base}.ffuf.json" -s >/dev/null 2>&1 || true

            jq -r 'select(.type=="response") | [.url, (.status|tostring)] | @tsv' "${base}.ferox.jsonl" 2>/dev/null > "${TMP}/${safe}.ferox.tsv" || true
            jq -r '.results[]? | [.url, (.status|tostring)] | @tsv' "${base}.ffuf.json" 2>/dev/null > "${TMP}/${safe}.ffuf.tsv" || true

            cat "${TMP}/${safe}.ferox.tsv" "${TMP}/${safe}.ffuf.tsv" 2>/dev/null | sed '/^[[:space:]]*$/d' | filter_codes | dedupe > "${base}.urls.txt"
          done < "$CLEANED"

          MASTER="$OUTDIR/ALL_UNIQUE_URLS.txt"
          cat "$OUTDIR"/*.urls.txt 2>/dev/null | sed '/^[[:space:]]*$/d' | dedupe > "$MASTER"
          echo "[+] Master file: $MASTER"
          SCRIPT_EOF

          # 2. Make it executable
          chmod +x fuzzall.sh

          # 3. Run it
          TARGET_TIMEOUT_SECONDS=$(( TIMEOUT_MIN * 60 ))
          ARGS=(-w wordlists/target.txt -l work/subs.txt -t "$THREADS" -R "$RATE" -o fuzz_out -T "$TARGET_TIMEOUT_SECONDS" -x "$EXCLUDE_CODES")
          if [ "$RECURSION" = "off" ]; then
            ARGS+=(--no-recursion)
          else
            ARGS+=(-d "$DEPTH")
          fi

          echo "▶ ./fuzzall.sh ${ARGS[*]}"
          ./fuzzall.sh "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dirfuzz-${{ github.run_id }}
          path: fuzz_out/
          retention-days: 30
          if-no-files-found: warn

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_COUNT:       ${{ steps.parse.outputs.count }}
          JOB_STATUS:         ${{ job.status }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then exit 0; fi
          total=0; [ -f fuzz_out/ALL_UNIQUE_URLS.txt ] && total=$(wc -l < fuzz_out/ALL_UNIQUE_URLS.txt)

          MSG=$'📂 DIR FUZZ \xe2\x80\x94 '"${JOB_STATUS}"$'\n• Targets: '"${TARGET_COUNT}"$'\n• Unique URLs: '"${total}"$'\n🔗 '"${RUN_URL}"

          # --data-urlencode handles newlines/special chars properly, unlike the
          # old hand-built '%0A'-joined query string.
          curl -sS -o /dev/null -w '[+] Telegram: HTTP %{http_code}\n' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true

      - name: Summary
        if: always()
        shell: bash
        env:
          TARGET_COUNT:   ${{ steps.parse.outputs.count }}
          WORDLIST_TIER:  ${{ inputs.wordlist }}
          WORDLIST_LINES: ${{ steps.wl.outputs.lines }}
          RECURSION:      ${{ inputs.recursion }}
          DEPTH:          ${{ inputs.depth }}
        run: |
          {
            echo "## Directory Fuzz"
            echo "| Targets | $TARGET_COUNT |"
            echo "| Wordlist | \`$WORDLIST_TIER\` ($WORDLIST_LINES entries) |"
            echo "| Recursion | \`$RECURSION\` |"
            echo "| Depth | \`$DEPTH\` |"
            echo ""
            if [ -f fuzz_out/ALL_UNIQUE_URLS.txt ]; then
              n=$(wc -l < fuzz_out/ALL_UNIQUE_URLS.txt | tr -d ' ')
              echo "### ✅ Unique URLs: $n"
              echo '```'; head -100 fuzz_out/ALL_UNIQUE_URLS.txt; echo '```'
            else
              echo "### ⚠️ No results — \`fuzz_out/ALL_UNIQUE_URLS.txt\` not produced"
              echo '```'
              ls -la fuzz_out/ 2>/dev/null || echo "directory does not exist"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
        continue-on-error: true
