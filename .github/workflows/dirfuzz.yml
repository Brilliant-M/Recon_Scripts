name: Directory Fuzz

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Target(s) — comma, space, or newline separated'
        required: true
        type: string
      wordlist:
        description: 'Wordlist tier'
        required: true
        type: choice
        default: 'quick'
        options: [quick, standard, deep, custom]
      custom_wordlist:
        description: 'Custom wordlist URL (http/https only; used when wordlist=custom)'
        required: false
        type: string
        default: ''
      recursion:
        description: 'Recursion (feroxbuster)'
        required: true
        type: choice
        default: 'off'
        options: ['off', 'on']
      depth:
        description: 'Max recursion depth (recursion=on only; 0 = unlimited)'
        required: false
        type: string
        default: '2'
      threads:
        description: 'Threads (default 20)'
        required: false
        type: string
        default: '20'
      rate:
        description: 'Max req/sec (default 20)'
        required: false
        type: string
        default: '20'
      exclude_codes:
        description: 'Comma-separated status codes to drop from merged results (e.g. 403,500)'
        required: false
        type: string
        default: ''
      per_target_timeout:
        description: 'Max minutes any single tool run may use on one target (default 15)'
        required: false
        type: string
        default: '15'
      total_budget_minutes:
        description: 'Hard cap for ALL targets combined, in minutes (max 105; default 100). Time is split fairly across targets.'
        required: false
        type: string
        default: '100'

concurrency:
  group: dirfuzz-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # All free-text inputs are validated BEFORE any tool runs, and everywhere
      # below they are passed via `env:` + `$VAR`, never spliced into run: text
      # directly — the old workflow interpolated some inputs straight into shell
      # (e.g. `URL="${{ inputs.custom_wordlist }}"`), which is a classic GitHub
      # Actions script-injection hole: a crafted input value could break out of
      # the quotes and run arbitrary commands on the runner.
      - name: Validate inputs
        env:
          WORDLIST_TIER: ${{ inputs.wordlist }}
          CUSTOM_WORDLIST: ${{ inputs.custom_wordlist }}
          DEPTH: ${{ inputs.depth }}
          THREADS: ${{ inputs.threads }}
          RATE: ${{ inputs.rate }}
          TIMEOUT_MIN: ${{ inputs.per_target_timeout }}
          BUDGET_MIN: ${{ inputs.total_budget_minutes }}
          EXCLUDE_CODES: ${{ inputs.exclude_codes }}
        run: |
          set -euo pipefail
          err() { echo "❌ $1"; exit 1; }

          [[ "$THREADS"     =~ ^[0-9]+$ ]] || err "threads must be a positive integer"
          [[ "$RATE"        =~ ^[0-9]+$ ]] || err "rate must be a positive integer"
          [[ "$DEPTH"       =~ ^[0-9]+$ ]] || err "depth must be a non-negative integer (0 = unlimited)"
          [[ "$TIMEOUT_MIN" =~ ^[0-9]+$ ]] || err "per_target_timeout must be a positive integer"
          [[ "$BUDGET_MIN"  =~ ^[0-9]+$ ]] || err "total_budget_minutes must be a positive integer"
          # The job limit is 120 min; ~5 min is needed for tool install + upload/notify steps.
          (( BUDGET_MIN >= 1 && BUDGET_MIN <= 105 )) || err "total_budget_minutes must be between 1 and 105"

          if [ -n "$EXCLUDE_CODES" ]; then
            [[ "$EXCLUDE_CODES" =~ ^[0-9]+(,[0-9]+)*$ ]] || err "exclude_codes must be comma-separated numbers, e.g. 403,500"
          fi

          if [ "$WORDLIST_TIER" = "custom" ]; then
            [ -z "$CUSTOM_WORDLIST" ] && err "custom_wordlist URL required when wordlist=custom"
            [[ "$CUSTOM_WORDLIST" =~ ^https?:// ]] || err "custom_wordlist must be an http(s) URL"
          fi
          echo "✅ inputs OK"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install base packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl unzip

      - name: Install ffuf + uro
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Pinned instead of @latest — bump this deliberately when you want to upgrade.
          go install github.com/ffuf/ffuf/v2@v2.1.0
          pip3 install --quiet uro
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          ffuf -V
          uro --help >/dev/null && echo "uro OK"

      - name: Install feroxbuster
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cd "$(mktemp -d)"

          # The upstream install-nix.sh always pulls "releases/latest" regardless of
          # which script tag you fetch, and failed silently here (no zip downloaded,
          # then unzip failed). Download the release asset directly instead, with
          # curl -f so a failed download is a loud error, not a silent one.
          # Try the pinned tag first, then latest, then build from source as a last resort.
          FEROX_VER="v2.10.1"   # pinned; bump deliberately
          ASSET="x86_64-linux-feroxbuster.zip"
          if curl -fsSL -o ferox.zip "https://github.com/epi052/feroxbuster/releases/download/${FEROX_VER}/${ASSET}" \
             || curl -fsSL -o ferox.zip "https://github.com/epi052/feroxbuster/releases/latest/download/${ASSET}"; then
            unzip -o ferox.zip -d "$HOME/.local/bin"
            chmod +x "$HOME/.local/bin/feroxbuster"
          else
            echo "release download failed — falling back to cargo install (slower)"
            cargo install feroxbuster --locked --root "$HOME/.local"
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/feroxbuster" --version

      - name: Cache wordlist
        id: wl_cache
        uses: actions/cache@v4
        with:
          path: wordlists/target.txt
          key: wordlist-${{ inputs.wordlist }}-${{ inputs.custom_wordlist }}

      - name: Download wordlist
        if: steps.wl_cache.outputs.cache-hit != 'true'
        env:
          WORDLIST_TIER: ${{ inputs.wordlist }}
          CUSTOM_WORDLIST: ${{ inputs.custom_wordlist }}
        run: |
          mkdir -p wordlists
          case "$WORDLIST_TIER" in
            quick)    URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt" ;;
            standard) URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/DirBuster-2007_directory-list-2.3-medium.txt" ;;
            deep)     URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/raft-large-directories.txt" ;;
            custom)   URL="$CUSTOM_WORDLIST" ;;
          esac
          echo "Downloading: $URL"
          curl -fsSL "$URL" -o wordlists/target.txt

      - name: Wordlist stats
        id: wl
        run: |
          lines=$(wc -l < wordlists/target.txt | tr -d ' ')
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "[+] $lines entries ready."

      - name: Parse targets
        id: parse
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          if [ -z "$TARGETS" ]; then
            echo "❌ Error: The 'targets' input cannot be empty."
            exit 1
          fi
          mkdir -p work
          echo "$TARGETS" | tr -s ' ,\t' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d' > work/subs.txt
          n=$(wc -l < work/subs.txt | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          cat work/subs.txt

      # ==========================================
      # THIS STEP BUILDS AND RUNS THE SCRIPT
      # ==========================================
      - name: Generate and Run fuzzall.sh
        env:
          THREADS:       ${{ inputs.threads }}
          RATE:          ${{ inputs.rate }}
          DEPTH:         ${{ inputs.depth }}
          RECURSION:     ${{ inputs.recursion }}
          EXCLUDE_CODES: ${{ inputs.exclude_codes }}
          TIMEOUT_MIN:   ${{ inputs.per_target_timeout }}
          BUDGET_MIN:    ${{ inputs.total_budget_minutes }}
        run: |
          # 1. Write the bash script to a file on the runner
          cat > fuzzall.sh << 'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -uo pipefail

          WORDLIST=""
          SUBS_FILE=""
          THREADS=20
          RATE=20
          OUTDIR="./fuzz_out"
          FEROX_RECURSION=1
          FEROX_DEPTH=""
          TARGET_TIMEOUT=900     # max seconds any single tool run may use
          EXCLUDE_CODES=""
          BUDGET=6000            # total seconds for ALL targets; the script finishes inside this

          while [[ $# -gt 0 ]]; do
            case "$1" in
              -w) WORDLIST="$2"; shift 2 ;;
              -l) SUBS_FILE="$2"; shift 2 ;;
              -t) THREADS="$2"; shift 2 ;;
              -R|--rate) RATE="$2"; shift 2 ;;
              -o) OUTDIR="$2"; shift 2 ;;
              -d) FEROX_DEPTH="$2"; shift 2 ;;
              -T) TARGET_TIMEOUT="$2"; shift 2 ;;
              -x) EXCLUDE_CODES="$2"; shift 2 ;;
              -B) BUDGET="$2"; shift 2 ;;
              --no-recursion) FEROX_RECURSION=0; shift ;;
              *) shift ;;
            esac
          done

          LOGS="$OUTDIR/logs"       # visible folder so tool logs are included in the artifact
          TMP="$OUTDIR/.tmp"
          REPORT="$OUTDIR/run_report.txt"
          mkdir -p "$OUTDIR" "$LOGS" "$TMP"
          : > "$REPORT"
          say () { echo "$*" | tee -a "$REPORT"; }

          clean_subs () {
            tr -d '\r' < "$1" \
              | sed -E 's/#.*$//; s/^[[:space:]]+//; s/[[:space:]]+$//' \
              | sed -E '/^$/d' \
              | while IFS= read -r line; do
                  case "$line" in
                    http://*|https://*) echo "$line" ;;
                    *) echo "https://$line" ;;
                  esac
                done \
              | sort -u
          }

          dedupe () {
            if command -v uro >/dev/null 2>&1; then uro | sort -u; else sort -u; fi
          }

          # Drops rows whose status code is in EXCLUDE_CODES, then keeps just the URL.
          filter_codes () {
            if [[ -n "$EXCLUDE_CODES" ]]; then
              awk -F'\t' -v exclude=",${EXCLUDE_CODES}," '{ if (index(exclude, "," $2 ",") == 0) print $1 }'
            else
              awk -F'\t' '{ print $1 }'
            fi
          }

          CLEANED="$OUTDIR/subs.cleaned.txt"
          clean_subs "$SUBS_FILE" > "$CLEANED"
          N=$(wc -l < "$CLEANED" | tr -d ' ')
          WL_LINES=$(wc -l < "$WORDLIST" | tr -d ' ')
          START=$(date +%s)
          DEADLINE=$(( START + BUDGET ))

          # Fix: the old script gave every tool run its own fixed timeout, so total time was
          # targets x 2 x timeout with no overall cap — the job simply hit the 2h limit and was
          # cancelled. Now the remaining budget is divided across the tool runs still to do.
          slice_secs () {   # $1 = number of tool runs still to do, including the one about to start
            local left=$(( DEADLINE - $(date +%s) )) runs=$1 s
            (( runs < 1 )) && runs=1
            s=$(( left / runs ))
            (( s > TARGET_TIMEOUT )) && s=$TARGET_TIMEOUT
            (( s < 0 )) && s=0
            echo "$s"
          }

          first=$(slice_secs $(( N * 2 )))
          say "[plan] $N target(s) x 2 tools | wordlist $WL_LINES entries | rate $RATE req/s | budget $(( BUDGET / 60 )) min"
          if (( RATE > 0 && WL_LINES > 0 )); then
            need=$(( WL_LINES / RATE ))
            cov=$(( first * RATE * 100 / WL_LINES )); (( cov > 100 )) && cov=100
            say "[plan] one full wordlist pass takes ~$(( need / 60 )) min per tool per target; each tool gets ~$(( first / 60 )) min => ~${cov}% of the wordlist"
            if (( cov < 100 )); then
              say "[plan] NOTE: coverage is under 100% — raise rate, use a smaller wordlist tier, scan fewer targets per run, or raise the budget."
            fi
          fi

          i=0
          while IFS= read -r entry; do
            [[ -z "$entry" ]] && continue
            i=$(( i + 1 ))
            url="$entry"

            if (( DEADLINE - $(date +%s) < 20 )); then
              say "[!] ($i/$N) budget exhausted — SKIPPED: $url"
              continue
            fi

            hash=$(printf '%s' "$url" | sha1sum | cut -c1-8)
            safe="$(printf '%s' "$url" | sed -E 's#https?://##; s#[^A-Za-z0-9]+#_#g; s#_+$##')_${hash}"
            base="$OUTDIR/$safe"
            runs_left=$(( (N - i + 1) * 2 ))

            # ---- feroxbuster ----
            s1=$(slice_secs "$runs_left")
            say "[*] ($i/$N) $url — feroxbuster for up to ${s1}s"
            # --time-limit makes feroxbuster stop gracefully (results are streamed to the .jsonl
            # as found, so nothing is lost); the outer timeout is only a backstop.
            ferox_args=(-u "$url" -w "$WORDLIST" -t "$THREADS" --rate-limit "$RATE" --scan-limit 2 --auto-tune --auto-bail --timeout 10 --time-limit "${s1}s" --no-state --json -o "${base}.ferox.jsonl" -q)
            [[ "$FEROX_RECURSION" -eq 0 ]] && ferox_args+=( --no-recursion )
            # Always pass --depth when recursion is on (feroxbuster treats 0 as unlimited).
            [[ "$FEROX_RECURSION" -eq 1 ]] && ferox_args+=( --depth "$FEROX_DEPTH" )
            timeout -k 15s "$(( s1 + 30 ))s" feroxbuster "${ferox_args[@]}" > "$LOGS/${safe}.ferox.log" 2>&1
            rc=$?
            (( rc == 124 || rc == 137 )) && say "    [!] feroxbuster had to be force-stopped"

            # ---- ffuf ----
            s2=$(slice_secs $(( runs_left - 1 )))
            if (( s2 >= 5 )); then
              say "    ffuf for up to ${s2}s"
              # -maxtime makes ffuf stop cleanly AND write its JSON; ffuf writes output only on a
              # clean exit, so a hard kill would lose everything. SIGINT backstop does the same.
              timeout -s INT -k 15s "$(( s2 + 30 ))s" ffuf -w "$WORDLIST" -u "${url%/}/FUZZ" -t "$THREADS" -rate "$RATE" -timeout 10 -maxtime "$s2" -ac -of json -o "${base}.ffuf.json" -s > "$LOGS/${safe}.ffuf.log" 2>&1
            else
              say "    [!] not enough budget left for ffuf on this target"
            fi

            jq -r 'select(.type=="response") | [.url, (.status|tostring)] | @tsv' "${base}.ferox.jsonl" 2>/dev/null > "${TMP}/${safe}.ferox.tsv" || true
            jq -r '.results[]? | [.url, (.status|tostring)] | @tsv' "${base}.ffuf.json" 2>/dev/null > "${TMP}/${safe}.ffuf.tsv" || true

            cat "${TMP}/${safe}.ferox.tsv" "${TMP}/${safe}.ffuf.tsv" 2>/dev/null | sed '/^[[:space:]]*$/d' | filter_codes | dedupe > "${base}.urls.txt"
            say "    -> $(wc -l < "${base}.urls.txt" | tr -d ' ') URLs  (ferox $(wc -l < "${TMP}/${safe}.ferox.tsv" | tr -d ' ') / ffuf $(wc -l < "${TMP}/${safe}.ffuf.tsv" | tr -d ' '))"
          done < "$CLEANED"

          MASTER="$OUTDIR/ALL_UNIQUE_URLS.txt"
          cat "$OUTDIR"/*.urls.txt 2>/dev/null | sed '/^[[:space:]]*$/d' | dedupe > "$MASTER"
          say "[+] Master file: $MASTER ($(wc -l < "$MASTER" | tr -d ' ') URLs) — finished in $(( ($(date +%s) - START) / 60 )) min"
          SCRIPT_EOF

          # 2. Make it executable
          chmod +x fuzzall.sh

          # 3. Run it
          TARGET_TIMEOUT_SECONDS=$(( TIMEOUT_MIN * 60 ))
          ARGS=(-w wordlists/target.txt -l work/subs.txt -t "$THREADS" -R "$RATE" -o fuzz_out -T "$TARGET_TIMEOUT_SECONDS" -x "$EXCLUDE_CODES" -B "$(( BUDGET_MIN * 60 ))")
          if [ "$RECURSION" = "off" ]; then
            ARGS+=(--no-recursion)
          else
            ARGS+=(-d "$DEPTH")
          fi

          echo "▶ ./fuzzall.sh ${ARGS[*]}"
          ./fuzzall.sh "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dirfuzz-${{ github.run_id }}
          path: fuzz_out/
          retention-days: 30
          if-no-files-found: warn

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_COUNT:       ${{ steps.parse.outputs.count }}
          JOB_STATUS:         ${{ job.status }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then exit 0; fi
          total=0; [ -f fuzz_out/ALL_UNIQUE_URLS.txt ] && total=$(wc -l < fuzz_out/ALL_UNIQUE_URLS.txt)

          MSG=$'📂 DIR FUZZ \xe2\x80\x94 '"${JOB_STATUS}"$'\n• Targets: '"${TARGET_COUNT}"$'\n• Unique URLs: '"${total}"$'\n🔗 '"${RUN_URL}"

          # --data-urlencode handles newlines/special chars properly, unlike the
          # old hand-built '%0A'-joined query string.
          curl -sS -o /dev/null -w '[+] Telegram: HTTP %{http_code}\n' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true

      - name: Summary
        if: always()
        shell: bash
        env:
          TARGET_COUNT:   ${{ steps.parse.outputs.count }}
          WORDLIST_TIER:  ${{ inputs.wordlist }}
          WORDLIST_LINES: ${{ steps.wl.outputs.lines }}
          RECURSION:      ${{ inputs.recursion }}
          DEPTH:          ${{ inputs.depth }}
        run: |
          {
            echo "## Directory Fuzz"
            echo "| Targets | $TARGET_COUNT |"
            echo "| Wordlist | \`$WORDLIST_TIER\` ($WORDLIST_LINES entries) |"
            echo "| Recursion | \`$RECURSION\` |"
            echo "| Depth | \`$DEPTH\` |"
            echo ""
            if [ -f fuzz_out/run_report.txt ]; then
              echo "### Run report"
              echo '```'; cat fuzz_out/run_report.txt; echo '```'
            fi
            if [ -f fuzz_out/ALL_UNIQUE_URLS.txt ]; then
              n=$(wc -l < fuzz_out/ALL_UNIQUE_URLS.txt | tr -d ' ')
              echo "### ✅ Unique URLs: $n"
              echo '```'; head -100 fuzz_out/ALL_UNIQUE_URLS.txt; echo '```'
            else
              echo "### ⚠️ No results — \`fuzz_out/ALL_UNIQUE_URLS.txt\` not produced"
              echo '```'
              ls -la fuzz_out/ 2>/dev/null || echo "directory does not exist"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
        continue-on-error: true
