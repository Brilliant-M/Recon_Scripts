name: Directory Fuzz

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Target(s) — comma, space, or newline separated (e.g. api.example.com dev.example.com)'
        required: true
        type: string
      wordlist:
        description: 'Wordlist tier'
        required: true
        type: choice
        default: 'quick'
        options: [quick, standard, deep, custom]
      custom_wordlist:
        description: 'Custom wordlist URL (only used when wordlist=custom)'
        required: false
        type: string
        default: ''
      recursion:
        description: 'Recursion (feroxbuster)'
        required: true
        type: choice
        default: 'off'
        options: ['off', 'on']
      depth:
        description: 'Max recursion depth (recursion=on only; 0=unlimited)'
        required: false
        type: string
        default: '2'
      threads:
        description: 'Threads (default 20)'
        required: false
        type: string
        default: '20'
      rate:
        description: 'Max req/sec (empty = auto)'
        required: false
        type: string
        default: ''

concurrency:
  group: dirfuzz-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify scripts exist
        run: |
          test -f fuzzall.sh || { echo "❌ fuzzall.sh missing"; exit 1; }
          echo "✅ fuzzall.sh present"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install base packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl unzip dnsutils

      - name: Install ffuf + uro
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/ffuf/ffuf/v2@latest
          pip3 install --quiet uro
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          ffuf -V
          uro --help >/dev/null && echo "uro OK"

      - name: Install feroxbuster
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL https://raw.githubusercontent.com/epi052/feroxbuster/main/install-nix.sh \
            | bash -s "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/feroxbuster" --version

      - name: Download wordlist
        id: wl
        run: |
          mkdir -p wordlists
          case "${{ inputs.wordlist }}" in
            quick)    URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt" ;;
            standard) URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/directory-list-2.3-medium.txt" ;;
            deep)     URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/raft-large-directories.txt" ;;
            custom)
              [ -z "${{ inputs.custom_wordlist }}" ] && { echo "❌ custom_wordlist URL required"; exit 1; }
              URL="${{ inputs.custom_wordlist }}"
              ;;
          esac
          echo "Downloading: $URL"
          curl -fsSL "$URL" -o wordlists/target.txt
          lines=$(wc -l < wordlists/target.txt | tr -d ' ')
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "[+] $lines entries"

      - name: Parse targets
        id: parse
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          if [ -z "$TARGETS" ]; then
            echo "❌ Error: The 'targets' input cannot be empty. Please provide at least one domain."
            exit 1
          fi
          mkdir -p work
          # Replaces commas, spaces, and tabs with newlines
          echo "$TARGETS" | tr -s ' ,\t' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d' \
            > work/subs.txt
          n=$(wc -l < work/subs.txt | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          cat work/subs.txt
          test -s work/subs.txt

      - name: Make script executable
        run: |
          test -f fuzzall.sh || { echo "❌ fuzzall.sh missing"; exit 1; }
          chmod +x fuzzall.sh

      - name: Run directory fuzz
        env:
          THREADS:    ${{ inputs.threads }}
          RATE_IN:    ${{ inputs.rate }}
          DEPTH:      ${{ inputs.depth }}
          RECURSION:  ${{ inputs.recursion }}
          WL_TIER:    ${{ inputs.wordlist }}
        run: |
          set -euo pipefail
          RATE="$RATE_IN"
          if [ -z "$RATE" ]; then
            case "$WL_TIER" in quick) RATE=20 ;; *) RATE=50 ;; esac
            echo "[*] Auto rate: $RATE req/s"
          fi
          ARGS=(-w wordlists/target.txt -l work/subs.txt -t "$THREADS" -R "$RATE" -o fuzz_out)
          if [ "$RECURSION" = "off" ]; then
            ARGS+=(--no-recursion)
          elif [ -n "$DEPTH" ] && [ "$DEPTH" != "0" ]; then
            ARGS+=(-d "$DEPTH")
          fi
          echo "▶ ./fuzzall.sh ${ARGS[*]}"
          ./fuzzall.sh "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dirfuzz-${{ github.run_id }}
          path: fuzz_out/
          retention-days: 30
          if-no-files-found: warn

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_COUNT:       ${{ steps.parse.outputs.count }}
          WL_TIER:            ${{ inputs.wordlist }}
          RECURSION:          ${{ inputs.recursion }}
          JOB_STATUS:         ${{ job.status }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "[!] Telegram secrets not configured — skipping"; exit 0
          fi
          MSG="$RUNNER_TEMP/tg.txt"
          total=0
          [ -f fuzz_out/ALL_UNIQUE_URLS.txt ] && total=$(wc -l < fuzz_out/ALL_UNIQUE_URLS.txt | tr -d ' ')
          {
            echo "📂 DIR FUZZ — ${JOB_STATUS}"
            echo "Targets: ${TARGET_COUNT}"
            echo "Wordlist: ${WL_TIER} | Recursion: ${RECURSION}"
            echo ""
            echo "📊 Results"
            echo "• Unique URLs: ${total}"
            echo ""
            if [ "$total" -gt 0 ]; then
              echo "🎯 Top URLs:"
              head -20 fuzz_out/ALL_UNIQUE_URLS.txt | sed 's/^/  /'
              [ "$total" -gt 20 ] && echo "  ... +$((total - 20)) more"
              echo ""
            fi
            echo "🔗 ${RUN_URL}"
          } > "$MSG"
          if [ "$(wc -c < "$MSG")" -gt 4000 ]; then
            head -c 3900 "$MSG" > "${MSG}.t"
            printf '\n\n... [truncated]\n' >> "${MSG}.t"
            mv "${MSG}.t" "$MSG"
          fi
          curl -sS -o /dev/null -w '[+] Telegram: HTTP %{http_code}\n' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@${MSG}" \
            -d "disable_web_page_preview=true" \
            --max-time 30 || echo "[!] Telegram send failed (continuing)"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Directory Fuzz"
            echo "| Targets | ${{ steps.parse.outputs.count }} |"
            echo "| Wordlist | \`${{ inputs.wordlist }}\` (${{ steps.wl.outputs.lines }} entries) |"
            echo "| Recursion | \`${{ inputs.recursion }}\` |"
            echo "| Depth | \`${{ inputs.depth }}\` |"
            echo ""
            if [ -f fuzz_out/ALL_UNIQUE_URLS.txt ]; then
              n=$(wc -l < fuzz_out/ALL_UNIQUE_URLS.txt | tr -d ' ')
              echo "### ✅ Unique URLs: $n"
              echo '```'; head -100 fuzz_out/ALL_UNIQUE_URLS.txt; echo '```'
            else
              echo "### ⚠️ No results — \`fuzz_out/ALL_UNIQUE_URLS.txt\` not produced"
              echo '```'
              ls -la fuzz_out/ 2>/dev/null || echo "directory does not exist"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
        continue-on-error: true
