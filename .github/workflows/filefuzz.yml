name: File & Extension Fuzz

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Target(s) — comma, space, or newline separated'
        required: true
        type: string
      wordlist:
        description: 'Wordlist tier'
        required: true
        type: choice
        default: 'backups'
        options: [quick, standard, backups, custom]
      custom_wordlist:
        description: 'Custom wordlist URL (only when wordlist=custom)'
        required: false
        type: string
        default: ''
      ext_preset:
        description: 'Extension preset'
        required: true
        type: choice
        default: 'backup'
        options: [web, backup, config, source, archive, all, custom]
      custom_ext:
        description: 'Custom ext list (only when ext_preset=custom; e.g. .php,.bak,.env)'
        required: false
        type: string
        default: ''
      force_ext:
        description: 'Force extensions on all entries (noisy)'
        required: true
        type: choice
        default: 'off'
        options: ['off', 'on']
      triage:
        description: 'Run httpx triage'
        required: true
        type: choice
        default: 'on'
        options: ['on', 'off']
      time_limit:
        description: 'feroxbuster time limit (e.g. 15m, 1h)'
        required: false
        type: string
        default: ''
      threads:
        description: 'Threads (default 20)'
        required: false
        type: string
        default: '20'
      rate:
        description: 'Max req/sec (empty = auto)'
        required: false
        type: string
        default: ''

concurrency:
  group: filefuzz-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  filefuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify scripts exist
        run: |
          test -f filefuzz.sh || { echo "❌ filefuzz.sh missing"; exit 1; }
          echo "✅ filefuzz.sh present"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install base packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl unzip

      - name: Install ffuf + httpx + uro
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/ffuf/ffuf/v2@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          pip3 install --quiet uro
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          ffuf -V
          httpx -version
          uro --help >/dev/null && echo "uro OK"

      - name: Install feroxbuster
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL https://raw.githubusercontent.com/epi052/feroxbuster/main/install-nix.sh \
            | bash -s "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/feroxbuster" --version

      - name: Download wordlist
        id: wl
        run: |
          mkdir -p wordlists
          case "${{ inputs.wordlist }}" in
            quick)    URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt" ;;
            standard) URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/raft-large-files.txt" ;;
            backups)  URL="https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/Common-DB-Backups.txt" ;;
            custom)
              [ -z "${{ inputs.custom_wordlist }}" ] && { echo "❌ custom_wordlist URL required"; exit 1; }
              URL="${{ inputs.custom_wordlist }}"
              ;;
          esac
          echo "Downloading: $URL"
          curl -fsSL "$URL" -o wordlists/target.txt
          lines=$(wc -l < wordlists/target.txt | tr -d ' ')
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "[+] $lines entries"

      - name: Parse targets
        id: parse
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          if [ -z "$TARGETS" ]; then
            echo "❌ Error: The 'targets' input cannot be empty."
            exit 1
          fi
          mkdir -p work
          echo "$TARGETS" | tr -s ' ,\t' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d' \
            > work/subs.txt
          n=$(wc -l < work/subs.txt | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          cat work/subs.txt
          test -s work/subs.txt

      - name: Make script executable
        run: |
          test -f filefuzz.sh || { echo "❌ filefuzz.sh missing"; exit 1; }
          chmod +x filefuzz.sh

      - name: Run file & extension fuzz
        env:
          THREADS:    ${{ inputs.threads }}
          RATE_IN:    ${{ inputs.rate }}
          WL_TIER:    ${{ inputs.wordlist }}
          EXT_SET:    ${{ inputs.ext_preset }}
          CUSTOM_EXT: ${{ inputs.custom_ext }}
          FORCE_EXT:  ${{ inputs.force_ext }}
          TRIAGE:     ${{ inputs.triage }}
          TIME_LIMIT: ${{ inputs.time_limit }}
        run: |
          set -euo pipefail
          RATE="$RATE_IN"
          if [ -z "$RATE" ]; then
            case "$WL_TIER" in quick) RATE=20 ;; *) RATE=40 ;; esac
            echo "[*] Auto rate: $RATE req/s"
          fi
          ARGS=(-w wordlists/target.txt -l work/subs.txt -t "$THREADS" -r "$RATE" -o filefuzz_out)
          if [ "$EXT_SET" = "custom" ]; then
            [ -z "$CUSTOM_EXT" ] && { echo "❌ ext_preset=custom requires custom_ext"; exit 1; }
            ARGS+=(--ext "$CUSTOM_EXT")
          else
            ARGS+=(-e "$EXT_SET")
          fi
          [ "$FORCE_EXT" = "on" ] && ARGS+=(--force-ext)
          [ -n "$TIME_LIMIT" ]    && ARGS+=(--time "$TIME_LIMIT")
          [ "$TRIAGE"    = "off" ] && ARGS+=(--no-triage)
          echo "▶ ./filefuzz.sh ${ARGS[*]}"
          ./filefuzz.sh "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filefuzz-${{ github.run_id }}
          path: filefuzz_out/
          retention-days: 30
          if-no-files-found: warn

      # ---------- Telegram notify (inlined) ----------
      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_COUNT:       ${{ steps.parse.outputs.count }}
          WL_TIER:            ${{ inputs.wordlist }}
          EXT_SET:            ${{ inputs.ext_preset }}
          JOB_STATUS:         ${{ job.status }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "[!] Telegram secrets not configured — skipping"; exit 0
          fi

          MSG="$RUNNER_TEMP/tg.txt"
          total=0; sensitive=0; interesting=0
          [ -f filefuzz_out/ALL_UNIQUE_FILES.txt ]        && total=$(wc -l < filefuzz_out/ALL_UNIQUE_FILES.txt | tr -d ' ')
          [ -f filefuzz_out/triage_sensitive.txt ]        && sensitive=$(wc -l < filefuzz_out/triage_sensitive.txt | tr -d ' ')
          [ -f filefuzz_out/triage_interesting.txt ]      && interesting=$(wc -l < filefuzz_out/triage_interesting.txt | tr -d ' ')

          {
            echo "📄 FILE FUZZ — ${JOB_STATUS}"
            echo "Targets: ${TARGET_COUNT}"
            echo "Wordlist: ${WL_TIER} | Ext: ${EXT_SET}"
            echo ""
            echo "📊 Results"
            echo "• Unique URLs:      ${total}"
            echo "• 🎯 Sensitive:     ${sensitive}"
            echo "• 🔎 Interesting:   ${interesting}"
            echo ""

            if [ "$sensitive" -gt 0 ]; then
              echo "🎯 Top sensitive (backups/configs/archives):"
              head -15 filefuzz_out/triage_sensitive.txt | sed 's/^/  /'
              [ "$sensitive" -gt 15 ] && echo "  ... +$((sensitive - 15)) more"
              echo ""
            elif [ "$total" -gt 0 ]; then
              echo "🎯 Top URLs:"
              head -15 filefuzz_out/ALL_UNIQUE_FILES.txt | sed 's/^/  /'
              [ "$total" -gt 15 ] && echo "  ... +$((total - 15)) more"
              echo ""
            fi

            echo "🔗 ${RUN_URL}"
          } > "$MSG"

          if [ "$(wc -c < "$MSG")" -gt 4000 ]; then
            head -c 3900 "$MSG" > "${MSG}.t"
            printf '\n\n... [truncated — see artifact]\n' >> "${MSG}.t"
            mv "${MSG}.t" "$MSG"
          fi

          curl -sS -o /dev/null -w '[+] Telegram: HTTP %{http_code}\n' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@${MSG}" \
            -d "disable_web_page_preview=true" \
            --max-time 30 || echo "[!] Telegram send failed (continuing)"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## File & Extension Fuzz"
            echo "| Targets | ${{ steps.parse.outputs.count }} |"
            echo "| Wordlist | \`${{ inputs.wordlist }}\` |"
            echo "| Ext preset | \`${{ inputs.ext_preset }}\` |"
            echo "| Force ext | \`${{ inputs.force_ext }}\` |"
            echo "| Triage | \`${{ inputs.triage }}\` |"
            echo ""
            if [ -f filefuzz_out/triage_sensitive.txt ] && [ -s filefuzz_out/triage_sensitive.txt ]; then
              s=$(wc -l < filefuzz_out/triage_sensitive.txt | tr -d ' ')
              echo "### 🎯 Sensitive files ($s)"
              echo '```'; head -30 filefuzz_out/triage_sensitive.txt; echo '```'
            elif [ -f filefuzz_out/ALL_UNIQUE_FILES.txt ] && [ -s filefuzz_out/ALL_UNIQUE_FILES.txt ]; then
              n=$(wc -l < filefuzz_out/ALL_UNIQUE_FILES.txt | tr -d ' ')
              echo "### ✅ Unique URLs ($n)"
              echo '```'; head -30 filefuzz_out/ALL_UNIQUE_FILES.txt; echo '```'
            else
              echo "### ⚠️ No results"
              echo '```'
              ls -la filefuzz_out/ 2>/dev/null || echo "directory does not exist"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
        continue-on-error: true
