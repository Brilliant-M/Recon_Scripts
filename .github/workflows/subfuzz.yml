name: Subdomain Fuzz

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target root domain (e.g. example.com)'
        required: true
        type: string
      mode:
        description: 'Scan mode'
        required: true
        type: choice
        default: 'active'
        options: [passive, active, full]
      depth:
        description: 'Recursion depth (0 = off, only used when mode=full)'
        required: true
        type: choice
        default: '0'
        options: ['0', '1', '2', '3']
      threads:
        description: 'Threads (default 20)'
        required: false
        type: string
        default: '20'
      rate:
        description: 'Rate limit req/s (default 20)'
        required: false
        type: string
        default: '20'

concurrency:
  group: subfuzz-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify scripts exist
        run: |
          test -f subfuzz.sh || { echo "❌ subfuzz.sh missing"; exit 1; }
          echo "✅ subfuzz.sh present"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install base packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl dnsutils

      - name: Install massdns
        run: |
          git clone --depth 1 https://github.com/blechschmidt/massdns.git /tmp/massdns
          cd /tmp/massdns
          make -j
          sudo make install
          massdns --version

      - name: Install Go tools
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/tomnomnom/assetfinder@latest
          go install github.com/d3mondev/puredns/v2@latest
          go install github.com/Josue87/gotator@latest
          go install github.com/owasp-amass/amass/v4/...@master || echo "amass install failed (optional)"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install dnsgen
        run: pip install --quiet dnsgen

      - name: Download wordlists
        run: |
          mkdir -p wordlists
          curl -fsSL \
            https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt \
            -o wordlists/subdomains.txt
          curl -fsSL \
            https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/dns-Jhaddix.txt \
            -o wordlists/permutations.txt
          wc -l wordlists/subdomains.txt wordlists/permutations.txt
          test -s wordlists/subdomains.txt
          test -s wordlists/permutations.txt

      - name: Initialize resolvers
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          if ! puredns init; then
            echo "puredns init failed — falling back to trickest/resolvers"
            curl -fsSL https://raw.githubusercontent.com/trickest/resolvers/main/resolvers.txt -o resolvers.txt
          fi
          test -s resolvers.txt
          echo "resolvers.txt lines: $(wc -l < resolvers.txt)"

      - name: Make script executable
        run: |
          test -f subfuzz.sh || { echo "❌ subfuzz.sh missing"; exit 1; }
          chmod +x subfuzz.sh

      - name: Run enumeration
        env:
          TARGET:  ${{ inputs.target }}
          MODE:    ${{ inputs.mode }}
          DEPTH:   ${{ inputs.depth }}
          THREADS: ${{ inputs.threads }}
          RATE:    ${{ inputs.rate }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET" ]; then
            echo "❌ Error: The 'target' input cannot be empty."
            exit 1
          fi
          [[ "$TARGET" =~ ^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$ ]] || { echo "invalid domain: $TARGET"; exit 1; }

          ARGS=(-d "$TARGET" -w wordlists/subdomains.txt -r resolvers.txt -t "$THREADS" -R "$RATE")

          if [ "$MODE" = "passive" ]; then
            ARGS+=(--mode passive)
          elif [ "$MODE" = "full" ] && [ "$DEPTH" != "0" ]; then
            ARGS+=(--mode full --depth "$DEPTH" --perm wordlists/permutations.txt)
          fi

          echo "▶ ./subfuzz.sh ${ARGS[*]}"
          ./subfuzz.sh "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subfuzz-${{ inputs.target }}-${{ github.run_id }}
          path: subenum_out/
          retention-days: 30
          if-no-files-found: warn

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET:             ${{ inputs.target }}
          MODE:               ${{ inputs.mode }}
          DEPTH:              ${{ inputs.depth }}
          JOB_STATUS:         ${{ job.status }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "[!] Telegram secrets not configured — skipping"
            exit 0
          fi
          MSG="$RUNNER_TEMP/tg.txt"
          passive=0; resolved=0; live=0
          [ -f subenum_out/passive_subs.txt ]  && passive=$(wc -l < subenum_out/passive_subs.txt  | tr -d ' ')
          [ -f subenum_out/resolved_subs.txt ] && resolved=$(wc -l < subenum_out/resolved_subs.txt | tr -d ' ')
          [ -f subenum_out/live_hosts.txt ]    && live=$(wc -l < subenum_out/live_hosts.txt    | tr -d ' ')
          {
            echo "🔍 SUBFUZZ — ${JOB_STATUS}"
            echo "Target: ${TARGET}"
            echo "Mode:   ${MODE} (depth=${DEPTH})"
            echo ""
            echo "📊 Results"
            echo "• Passive candidates: ${passive}"
            echo "• Resolved:           ${resolved}"
            echo "• Live HTTP hosts:    ${live}"
            echo ""
            if [ "$live" -gt 0 ]; then
              echo "🌐 Top live hosts:"
              head -15 subenum_out/live_hosts.txt | sed 's/^/  /'
              [ "$live" -gt 15 ] && echo "  ... +$((live - 15)) more"
              echo ""
            fi
            echo "🔗 ${RUN_URL}"
          } > "$MSG"
          if [ "$(wc -c < "$MSG")" -gt 4000 ]; then
            head -c 3900 "$MSG" > "${MSG}.t"
            printf '\n\n... [truncated]\n' >> "${MSG}.t"
            mv "${MSG}.t" "$MSG"
          fi
          curl -sS -o /dev/null -w '[+] Telegram: HTTP %{http_code}\n' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@${MSG}" \
            -d "disable_web_page_preview=true" \
            --max-time 30 || echo "[!] Telegram send failed (continuing)"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Subdomain Fuzz — \`${{ inputs.target }}\`"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Mode | \`${{ inputs.mode }}\` |"
            echo "| Depth | \`${{ inputs.depth }}\` |"
            echo "| Threads | \`${{ inputs.threads }}\` |"
            echo "| Rate | \`${{ inputs.rate }}\` req/s |"
            echo ""
            found=0
            if [ -f subenum_out/live_hosts.txt ]; then
              found=1
              echo "### ✅ Live hosts ($(wc -l < subenum_out/live_hosts.txt))"
              echo '```'
              head -50 subenum_out/live_hosts.txt
              echo '```'
              echo ""
            fi
            if [ -f subenum_out/resolved_subs.txt ]; then
              found=1
              echo "### 🔎 Resolved ($(wc -l < subenum_out/resolved_subs.txt))"
              echo '```'
              head -50 subenum_out/resolved_subs.txt
              echo '```'
              echo ""
            fi
            if [ "$found" -eq 0 ]; then
              echo "### ⚠️ No results produced"
              echo ""
              echo "Check the **Run enumeration** step — it likely failed or produced no output."
              echo ""
              echo "Contents of \`subenum_out/\`:"
              echo '```'
              ls -la subenum_out/ 2>/dev/null || echo "directory does not exist"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
        continue-on-error: true
