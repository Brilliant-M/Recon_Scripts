name: Subdomain Fuzz

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target root domain (e.g. example.com)'
        required: true
        type: string
      mode:
        description: 'Scan mode'
        required: true
        type: choice
        default: 'active'
        options: [passive, active, full]
      depth:
        description: 'Recursion depth (0 = off, only used when mode=full)'
        required: true
        type: choice
        default: '0'
        options: ['0', '1', '2', '3']
      threads:
        description: 'Threads (default 20)'
        required: false
        type: string
        default: '20'
      rate:
        description: 'Rate limit req/s (default 20)'
        required: false
        type: string
        default: '20'
      phase_timeout_minutes:
        description: 'Max minutes per phase (dnsx/httpx/recursion) before it is killed (default 15)'
        required: false
        type: string
        default: '15'

# NOTE: concurrency.group is evaluated before any step runs, so it can only see
# the raw input — it can't be lowercased here. "Example.com" and "example.com"
# will therefore get separate queues. Not fixable without a wrapper workflow;
# flagging it rather than hiding it.
concurrency:
  group: subfuzz-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # Everything free-text (target, threads, rate, phase_timeout_minutes) is
      # checked here and, from this point on, passed via `env:` + `$VAR` rather
      # than spliced straight into run: text. The original workflow did this
      # correctly in the "Generate and Run" step but NOT in "Write summary",
      # where `${{ inputs.target }}` was interpolated directly into shell text —
      # a script-injection hole, since `target` is free text a user types in.
      - name: Validate inputs
        env:
          TARGET:  ${{ inputs.target }}
          THREADS: ${{ inputs.threads }}
          RATE:    ${{ inputs.rate }}
          PHASE_TIMEOUT_MIN: ${{ inputs.phase_timeout_minutes }}
        run: |
          set -euo pipefail
          err() { echo "❌ $1"; exit 1; }

          [[ "$THREADS" =~ ^[0-9]+$ ]] || err "threads must be a positive integer"
          [[ "$RATE"    =~ ^[0-9]+$ ]] || err "rate must be a positive integer"
          [[ "$PHASE_TIMEOUT_MIN" =~ ^[0-9]+$ ]] || err "phase_timeout_minutes must be a positive integer"

          DOMAIN_RE='^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$'
          [[ "$TARGET" =~ $DOMAIN_RE ]] || err "target does not look like a valid root domain: $TARGET"

          # Normalize case for the rest of the job (concurrency.group above can't use this — see note).
          echo "TARGET_NORM=$(echo "$TARGET" | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"
          echo "✅ inputs OK"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install base packages
        run: |
          sudo apt-get update -qq
          # Added build-essential to ensure massdns compiles
          sudo apt-get install -y -qq jq curl dnsutils build-essential

      - name: Install massdns
        run: |
          # Pinned to a tag instead of the default branch HEAD — bump deliberately.
          # (Verify this tag still exists before relying on it; massdns tags infrequently.)
          MASSDNS_REF="v1.0.0"
          git clone --depth 1 --branch "$MASSDNS_REF" https://github.com/blechschmidt/massdns.git /tmp/massdns || \
            git clone --depth 1 https://github.com/blechschmidt/massdns.git /tmp/massdns
          cd /tmp/massdns
          make -j
          sudo make install
          # massdns has no --version flag (it treats it as a domain file and exits 1),
          # so just confirm the binary is installed and on PATH.
          command -v massdns && echo "massdns OK"

      - name: Install Go tools
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Pinned versions instead of @latest/@master for reproducibility.
          # Verify these tags against each project's releases page before trusting them long-term.
          SUBFINDER_VER="v2.6.6"
          DNSX_VER="v1.2.1"
          HTTPX_VER="v1.6.9"
          PUREDNS_VER="v2.1.1"
          AMASS_VER="v4.2.0"

          go install "github.com/projectdiscovery/subfinder/v2/cmd/subfinder@${SUBFINDER_VER}"
          go install "github.com/projectdiscovery/dnsx/cmd/dnsx@${DNSX_VER}"
          go install "github.com/projectdiscovery/httpx/cmd/httpx@${HTTPX_VER}"
          # No tagged releases worth pinning to — left on @latest intentionally.
          go install github.com/tomnomnom/assetfinder@latest
          go install "github.com/d3mondev/puredns/v2@${PUREDNS_VER}"
          # gotator publishes no semver tags (v1.2.0 does not exist) — its README says to use @latest.
          go install github.com/Josue87/gotator@latest
          go install "github.com/owasp-amass/amass/v4/...@${AMASS_VER}" || echo "amass install failed (optional)"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install dnsgen
        run: pip install --quiet dnsgen

      - name: Verify tools
        run: |
          export PATH="$PATH:$HOME/go/bin"
          MISSING=""
          for t in subfinder dnsx httpx puredns massdns jq curl; do
            if ! command -v "$t" >/dev/null 2>&1; then MISSING="$MISSING $t"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "❌ CRITICAL: Missing required tools:$MISSING"
            exit 1
          fi
          echo "✅ All required tools are installed and in PATH."

      - name: Download wordlists
        run: |
          mkdir -p wordlists
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt -o wordlists/subdomains.txt
          # Permutation words should be a short list (dev, stage, api...). The old 2M-line
          # dns-Jhaddix list would make gotator generate an unusably huge candidate set.
          head -n 100 wordlists/subdomains.txt > wordlists/permutations.txt
          wc -l wordlists/subdomains.txt wordlists/permutations.txt
          test -s wordlists/subdomains.txt
          test -s wordlists/permutations.txt

      - name: Download resolvers
        run: |
          # puredns has no "init" command (the old step always failed and fell through to
          # this download anyway), so fetch the public resolver list directly.
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/trickest/resolvers/main/resolvers.txt -o resolvers.txt
          test -s resolvers.txt
          echo "resolvers.txt lines: $(wc -l < resolvers.txt)"

      # ==========================================
      # THIS STEP BUILDS AND RUNS THE SCRIPT
      # ==========================================
      - name: Generate and Run subfuzz.sh
        env:
          TARGET:  ${{ env.TARGET_NORM }}
          MODE:    ${{ inputs.mode }}
          DEPTH:   ${{ inputs.depth }}
          THREADS: ${{ inputs.threads }}
          RATE:    ${{ inputs.rate }}
          PHASE_TIMEOUT_MIN: ${{ inputs.phase_timeout_minutes }}
        run: |
          export PATH="$PATH:$HOME/go/bin"

          # 1. Write the bash script to a file on the runner
          cat > subfuzz.sh << 'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -uo pipefail

          TARGET=""
          OUTDIR="./subenum_out"
          WORDLIST=""
          RESOLVERS=""
          MODE="active"
          RECURSION_DEPTH=0
          PERM_WORDLIST=""
          THREADS=20
          RATE=20
          PHASE_TIMEOUT=900

          while [[ $# -gt 0 ]]; do
            case "$1" in
              -d) TARGET="$2"; shift 2 ;;
              -w) WORDLIST="$2"; shift 2 ;;
              -r|--resolvers) RESOLVERS="$2"; shift 2 ;;
              -o) OUTDIR="$2"; shift 2 ;;
              -t) THREADS="$2"; shift 2 ;;
              -R|--rate) RATE="$2"; shift 2 ;;
              --mode) MODE="$2"; shift 2 ;;
              --depth) RECURSION_DEPTH="$2"; shift 2 ;;
              --perm) PERM_WORDLIST="$2"; shift 2 ;;
              --phase-timeout) PHASE_TIMEOUT="$2"; shift 2 ;;
              *) shift ;;
            esac
          done

          LOGS="$OUTDIR/logs"          # visible (non-hidden) so it is included in the uploaded artifact
          TMP="$OUTDIR/.tmp"
          mkdir -p "$OUTDIR" "$LOGS" "$TMP"
          TARGET_RE="${TARGET//./\\.}"

          count () { if [[ -f "$1" ]]; then wc -l < "$1" | tr -d ' '; else echo 0; fi; }

          # Fix: the old dedupe() fell back to a bare `sort -u` when `anew` was missing
          # (it never is installed here). That prints to the console and IGNORES the
          # output-file argument, so passive_subs.txt / resolved_subs.txt were never
          # written and every later phase had empty input. This one really writes the file.
          merge_into () {   # usage: <stdin> | merge_into FILE   (merges with existing FILE, unique)
            local f="$1" t
            t=$(mktemp)
            { [[ -f "$f" ]] && cat "$f"; cat; } | sed '/^$/d' | sort -u > "$t"
            mv "$t" "$f"
          }

          # Runs a tool with a timeout, keeps its output in logs/<name>.log (instead of
          # /dev/null, which hid every error), and reports non-zero exits.
          run_logged () {
            local name="$1"; shift
            timeout "${PHASE_TIMEOUT}s" "$@" > "$LOGS/$name.log" 2>&1
            local rc=$?
            if   [[ $rc -eq 124 ]]; then echo "[!] $name timed out after ${PHASE_TIMEOUT}s"
            elif [[ $rc -ne 0   ]]; then echo "[!] $name exited with $rc (logs/$name.log):"; tail -n 3 "$LOGS/$name.log" | sed 's/^/      /'
            fi
            return 0
          }

          # puredns' flag is --rate-limit (the old code passed -rate). `timeout` cannot run a
          # bash function, so the timeout lives inside here rather than around the call.
          rate_guard () {
            local name="$1" rate="$2" fails=0; shift 2
            while true; do
              timeout "${PHASE_TIMEOUT}s" "$@" --rate-limit "$rate" > "$LOGS/$name.log" 2>&1
              if grep -qiE 'REFUSED|SERVFAIL|too many requests' "$LOGS/$name.log"; then
                rate=$(( rate / 2 )); (( rate < 1 )) && rate=1
                fails=$(( fails + 1 ))
                echo "[!] $name: resolver pushback, retrying at ${rate}/s (attempt $fails)"
                (( fails >= 3 )) && return 1
                sleep $(( 15 * fails ))
              else
                break
              fi
            done
            return 0
          }

          echo "[*] Phase 1: Passive enumeration for $TARGET"
          if command -v subfinder >/dev/null 2>&1; then
            run_logged subfinder subfinder -d "$TARGET" -all -silent -o "$TMP/sub_subfinder.txt"
          fi
          if command -v assetfinder >/dev/null 2>&1; then
            timeout "${PHASE_TIMEOUT}s" assetfinder --subs-only "$TARGET" > "$TMP/sub_assetfinder.txt" 2> "$LOGS/assetfinder.log" || true
          fi
          if command -v amass >/dev/null 2>&1; then
            run_logged amass amass enum -passive -d "$TARGET" -timeout 5 -o "$TMP/sub_amass.txt"
          fi
          curl -s --max-time 60 "https://crt.sh/?q=%25.$TARGET&output=json" -o "$TMP/crt.json" 2> "$LOGS/crtsh.log" || echo "[!] crt.sh request failed (it often rate-limits CI runners)"
          jq -r '.[].name_value' "$TMP/crt.json" 2>> "$LOGS/crtsh.log" | sed 's/\*\.//g' | tr ',' '\n' | grep -oE "[A-Za-z0-9._-]+\.${TARGET_RE}" | sort -u > "$TMP/sub_crt.txt" || true

          : > "$OUTDIR/passive_subs.txt"
          cat "$TMP"/sub_*.txt 2>/dev/null | tr 'A-Z' 'a-z' | sed 's/\.$//' | grep -E "(^|\.)${TARGET_RE}$" | merge_into "$OUTDIR/passive_subs.txt"
          echo "[+] Passive: $(count "$OUTDIR/passive_subs.txt") candidates"
          for f in subfinder assetfinder amass crt; do printf '      %-12s %s\n' "$f" "$(count "$TMP/sub_$f.txt")"; done

          cp "$OUTDIR/passive_subs.txt" "$OUTDIR/all_subs_raw.txt"
          if [[ "$MODE" != "passive" ]]; then
            echo "[*] Phase 2: Active bruteforce (puredns)"
            # puredns writes results with -w/--write (the old code used -o, which is not a puredns
            # flag) and has no -t threads flag. RATE is now actually applied here.
            rate_guard puredns_bruteforce "$RATE" puredns bruteforce "$WORDLIST" "$TARGET" -r "$RESOLVERS" -w "$TMP/sub_bruteforce.txt" || true
            echo "[+] Bruteforce found: $(count "$TMP/sub_bruteforce.txt")"
            cat "$OUTDIR/passive_subs.txt" "$TMP/sub_bruteforce.txt" 2>/dev/null | sed '/^$/d' | sort -u > "$OUTDIR/all_subs_raw.txt"
          fi
          echo "[+] Raw merged: $(count "$OUTDIR/all_subs_raw.txt") candidates"

          echo "[*] Phase 3: Resolve (dnsx)"
          : > "$OUTDIR/resolved_subs.txt"
          if [[ -s "$OUTDIR/all_subs_raw.txt" ]]; then
            random_name="nonexistent-$(head -c 200 /dev/urandom | tr -dc a-z | head -c 8).$TARGET"
            wildcard_ip=$(dig +short "$random_name" A 2>/dev/null | head -n1 || true)
            if [[ -n "$wildcard_ip" ]]; then
              echo "[!] Wildcard DNS detected for $TARGET — filtering"
              run_logged dnsx dnsx -l "$OUTDIR/all_subs_raw.txt" -a -resp -silent -wd "$TARGET" -o "$TMP/resolved.txt"
            else
              run_logged dnsx dnsx -l "$OUTDIR/all_subs_raw.txt" -a -resp -silent -o "$TMP/resolved.txt"
            fi
            [[ -f "$TMP/resolved.txt" ]] && cp "$TMP/resolved.txt" "$OUTDIR/resolved_with_ips.txt"
            sed -E 's/[[:space:]].*$//' "$TMP/resolved.txt" 2>/dev/null | merge_into "$OUTDIR/resolved_subs.txt"
          else
            echo "[!] No candidates to resolve — skipping"
          fi
          echo "[+] Resolved: $(count "$OUTDIR/resolved_subs.txt") live subdomains"

          if [[ "$MODE" == "full" && "$RECURSION_DEPTH" -gt 0 && -s "$OUTDIR/resolved_subs.txt" ]]; then
            echo "[*] Phase 4: Recursion (depth=$RECURSION_DEPTH)"
            if [[ -n "$PERM_WORDLIST" && -r "$PERM_WORDLIST" ]]; then
              : > "$TMP/permuted_candidates.txt"
              if command -v gotator >/dev/null 2>&1; then
                # Candidate list is capped so permutations cannot explode the run.
                timeout "${PHASE_TIMEOUT}s" gotator -sub "$OUTDIR/resolved_subs.txt" -perm "$PERM_WORDLIST" -depth "$RECURSION_DEPTH" -numbers 10 -silent 2> "$LOGS/gotator.log" | head -n 1000000 > "$TMP/permuted_candidates.txt"
              elif command -v dnsgen >/dev/null 2>&1; then
                input="$OUTDIR/resolved_subs.txt"
                for ((i=1; i<=RECURSION_DEPTH; i++)); do
                  timeout "${PHASE_TIMEOUT}s" dnsgen "$input" 2>> "$LOGS/dnsgen.log" | head -n 1000000 > "$TMP/perm_$i.txt"
                  input="$TMP/perm_$i.txt"
                done
                cat "$TMP"/perm_*.txt 2>/dev/null | sort -u > "$TMP/permuted_candidates.txt"
              fi
              echo "[+] Permutation candidates: $(count "$TMP/permuted_candidates.txt")"
              if [[ -s "$TMP/permuted_candidates.txt" ]]; then
                rate_guard puredns_permuted "$RATE" puredns resolve "$TMP/permuted_candidates.txt" -r "$RESOLVERS" -w "$TMP/permuted_resolved.txt" || true
                echo "[+] Permutations that resolved: $(count "$TMP/permuted_resolved.txt")"
                cat "$TMP/permuted_resolved.txt" 2>/dev/null | merge_into "$OUTDIR/resolved_subs.txt"
              fi
            fi
          fi

          echo "[*] Phase 5: HTTP probing (httpx)"
          : > "$OUTDIR/live_hosts.txt"
          if [[ -s "$OUTDIR/resolved_subs.txt" ]]; then
            run_logged httpx httpx -l "$OUTDIR/resolved_subs.txt" -ports 80,443,8080,8443 -sc -title -tech-detect -cdn -silent -t "$THREADS" -rl "$RATE" -timeout 10 -o "$OUTDIR/live_hosts.txt"
          fi
          echo "[+] Live HTTP hosts: $(count "$OUTDIR/live_hosts.txt")"
          echo "[+] Done. Per-tool logs are in $LOGS/"
          SCRIPT_EOF

          # 2. Make it executable
          chmod +x subfuzz.sh

          # 3. Debug: Print the first few lines of the script to verify it's not corrupted
          echo "--- First 10 lines of generated script ---"
          head -n 10 subfuzz.sh
          echo "------------------------------------------"

          # 4. Run it
          if [ -z "$TARGET" ]; then exit 1; fi
          PHASE_TIMEOUT_SECONDS=$(( PHASE_TIMEOUT_MIN * 60 ))
          ARGS=(-d "$TARGET" -w wordlists/subdomains.txt -r resolvers.txt -t "$THREADS" -R "$RATE" --phase-timeout "$PHASE_TIMEOUT_SECONDS")
          if [ "$MODE" = "passive" ]; then ARGS+=(--mode passive); fi
          if [ "$MODE" = "full" ] && [ "$DEPTH" != "0" ]; then ARGS+=(--mode full --depth "$DEPTH" --perm wordlists/permutations.txt); fi

          echo "▶ ./subfuzz.sh ${ARGS[*]}"
          ./subfuzz.sh "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subfuzz-${{ inputs.target }}-${{ github.run_id }}
          path: subenum_out/
          retention-days: 30
          if-no-files-found: warn

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET:             ${{ env.TARGET_NORM }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then exit 0; fi
          passive=0; resolved=0; live=0
          [ -f subenum_out/passive_subs.txt ]  && passive=$(wc -l < subenum_out/passive_subs.txt)
          [ -f subenum_out/resolved_subs.txt ] && resolved=$(wc -l < subenum_out/resolved_subs.txt)
          [ -f subenum_out/live_hosts.txt ]    && live=$(wc -l < subenum_out/live_hosts.txt)

          MSG=$'🔍 SUBFUZZ \xe2\x80\x94 '"${TARGET}"$'\n• Passive: '"${passive}"$'\n• Resolved: '"${resolved}"$'\n• Live: '"${live}"$'\n🔗 '"${RUN_URL}"

          # --data-urlencode instead of hand-built '%0A' string — handles
          # newlines/special characters correctly.
          curl -sS -o /dev/null -w '[+] Telegram: HTTP %{http_code}\n' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true

      - name: Write summary
        if: always()
        env:
          TARGET: ${{ env.TARGET_NORM }}
          MODE:   ${{ inputs.mode }}
          DEPTH:  ${{ inputs.depth }}
        run: |
          {
            echo "## Subdomain Fuzz — \`$TARGET\`"
            echo "| Mode | \`$MODE\` |"
            echo "| Depth | \`$DEPTH\` |"
            echo ""
            if [ -f subenum_out/live_hosts.txt ]; then
              echo "### ✅ Live hosts ($(wc -l < subenum_out/live_hosts.txt))"
              echo '```'; head -50 subenum_out/live_hosts.txt; echo '```'
            else
              echo "### ⚠️ No results produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
        continue-on-error: true
