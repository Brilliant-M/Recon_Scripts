name: Triage

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs to triage (comma, space, or newline separated)'
        required: false
        type: string
        default: ''
      source_run_id:
        description: 'Prior workflow run ID to pull artifacts from (optional)'
        required: false
        type: string
        default: ''
      source_patterns:
        description: 'Artifact filenames to pull (comma-separated)'
        required: false
        type: string
        default: 'ALL_UNIQUE_FILES.txt,ALL_UNIQUE_URLS.txt,live_hosts.txt'
      threads:
        description: 'Threads (default 20)'
        required: false
        type: string
        default: '20'
      rate:
        description: 'Requests/sec (default 20)'
        required: false
        type: string
        default: '20'
      min_score:
        description: 'Minimum score for shortlist (default 3)'
        required: false
        type: string
        default: '3'
      soft404:
        description: 'Soft-404 detection'
        required: true
        type: choice
        default: '1'
        options: ['1', '0']
      headers:
        description: 'Custom headers, one per line'
        required: false
        type: string
        default: ''

concurrency:
  group: triage-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify scripts exist
        run: |
          test -f triage.sh || { echo "❌ triage.sh missing"; exit 1; }
          echo "✅ triage.sh present"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install jq + curl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl

      - name: Install httpx + uro
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          pip3 install --quiet uro
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          httpx -version
          uro --help >/dev/null && echo "uro OK"

      - name: Download prior artifacts
        if: ${{ inputs.source_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior_artifacts/
          merge-multiple: true

      - name: Prepare URLs
        env:
          URLS:            ${{ inputs.urls }}
          SOURCE_RUN_ID:   ${{ inputs.source_run_id }}
          SOURCE_PATTERNS: ${{ inputs.source_patterns }}
        run: |
          mkdir -p work
          : > work/urls.txt

          if [ -n "$URLS" ]; then
            # Replaces commas, spaces, and tabs with newlines
            echo "$URLS" | tr -s ' ,\t' '\n' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d' \
              >> work/urls.txt
          fi

          if [ -n "$SOURCE_RUN_ID" ]; then
            [ ! -d prior_artifacts ] && { echo "❌ prior_artifacts missing"; exit 1; }
            IFS=',' read -ra patterns <<< "$SOURCE_PATTERNS"
            for p in "${patterns[@]}"; do
              p_trim=$(echo "$p" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
              [ -z "$p_trim" ] && continue
              find prior_artifacts -type f -name "$p_trim" -exec cat {} + >> work/urls.txt 2>/dev/null || true
            done
          fi

          if [ ! -s work/urls.txt ] && [ -d prior_artifacts ]; then
            find prior_artifacts -type f \
              \( -name 'ALL_UNIQUE_*.txt' -o -name 'live_hosts.txt' \) \
              -exec cat {} + >> work/urls.txt 2>/dev/null || true
          fi

          sort -u work/urls.txt -o work/urls.txt
          n=$(wc -l < work/urls.txt | tr -d ' ')
          echo "[+] Total URLs: $n"
          [ "$n" -eq 0 ] && { echo "❌ No URLs to triage"; exit 1; }
          head -10 work/urls.txt

      - name: Prepare headers
        if: ${{ inputs.headers != '' }}
        env:
          HEADERS: ${{ inputs.headers }}
        run: |
          mkdir -p work
          printf '%s\n' "$HEADERS" | sed '/^$/d' > work/headers.txt
          echo "[*] $(wc -l < work/headers.txt) custom header(s)"

      - name: Make script executable
        run: |
          test -f triage.sh || { echo "❌ triage.sh missing"; exit 1; }
          chmod +x triage.sh

      - name: Run triage
        env:
          THREADS:   ${{ inputs.threads }}
          RATE:      ${{ inputs.rate }}
          MIN_SCORE: ${{ inputs.min_score }}
          SOFT404:   ${{ inputs.soft404 }}
        run: |
          set -euo pipefail
          ARGS=(-l work/urls.txt -o triage_out -t "$THREADS" -r "$RATE" --min-score "$MIN_SCORE" --soft404 "$SOFT404")
          if [ -f work/headers.txt ]; then
            while IFS= read -r h; do
              [ -n "$h" ] && ARGS+=(-H "$h")
            done < work/headers.txt
          fi
          echo "▶ ./triage.sh ${ARGS[*]}"
          ./triage.sh "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-${{ github.run_id }}
          path: triage_out/
          retention-days: 30
          if-no-files-found: warn

      # ---------- Telegram notify (inlined) ----------
      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MIN_SCORE:          ${{ inputs.min_score }}
          JOB_STATUS:         ${{ job.status }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "[!] Telegram secrets not configured — skipping"; exit 0
          fi
          MSG="$RUNNER_TEMP/tg.txt"

          input=0; short=0; bypass=0; err=0; direct=0; cfg=0
          [ -f work/urls.txt ]                            && input=$(wc -l < work/urls.txt | tr -d ' ')
          [ -f triage_out/WORTH_TESTING.txt ]             && short=$(awk '!/^#/' triage_out/WORTH_TESTING.txt | wc -l | tr -d ' ')
          [ -f triage_out/class_bypass_candidates.txt ]   && bypass=$(wc -l < triage_out/class_bypass_candidates.txt | tr -d ' ')
          [ -f triage_out/class_error_inject.txt ]        && err=$(wc -l < triage_out/class_error_inject.txt | tr -d ' ')
          [ -f triage_out/class_direct_hits.txt ]         && direct=$(wc -l < triage_out/class_direct_hits.txt | tr -d ' ')
          [ -f triage_out/tag_config_backup.txt ]         && cfg=$(wc -l < triage_out/tag_config_backup.txt | tr -d ' ')

          {
            echo "🎯 TRIAGE — ${JOB_STATUS}"
            echo "Input: ${input} URLs | Min score: ${MIN_SCORE}"
            echo ""
            echo "📊 Results"
            echo "• Worth testing: ${short}"
            echo "• 403/401 bypass: ${bypass}"
            echo "• 5xx errors:     ${err}"
            echo "• 2xx direct:     ${direct}"
            echo "• Config/backup:  ${cfg}"
            echo ""

            if [ "$short" -gt 0 ]; then
              echo "🏆 Top ranked:"
              awk '!/^#/' triage_out/WORTH_TESTING.txt | head -15 | sed 's/^/  /'
              [ "$short" -gt 15 ] && echo "  ... +$((short - 15)) more"
              echo ""
            fi

            echo "🔗 ${RUN_URL}"
          } > "$MSG"

          if [ "$(wc -c < "$MSG")" -gt 4000 ]; then
            head -c 3900 "$MSG" > "${MSG}.t"
            printf '\n\n... [truncated — see artifact]\n' >> "${MSG}.t"
            mv "${MSG}.t" "$MSG"
          fi

          curl -sS -o /dev/null -w '[+] Telegram: HTTP %{http_code}\n' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@${MSG}" \
            -d "disable_web_page_preview=true" \
            --max-time 30 || echo "[!] Telegram send failed (continuing)"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Triage"
            echo "| Source run | \`${{ inputs.source_run_id }}\` |"
            echo "| Min score | \`${{ inputs.min_score }}\` |"
            echo "| Soft-404 | \`${{ inputs.soft404 }}\` |"
            echo ""
            if [ -f triage_out/summary.txt ]; then
              echo "### Summary"
              echo '```'; cat triage_out/summary.txt; echo '```'
            fi
            if [ -f triage_out/WORTH_TESTING.txt ]; then
              echo "### 🎯 Worth-testing (top 40)"
              echo '```'
              awk '!/^#/' triage_out/WORTH_TESTING.txt | head -40
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
        continue-on-error: true
